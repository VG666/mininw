md) | 127.0.0.1 loopback HTTP RPC 完整实现（主同步通道） |\n| [nw_json.h](../src/nw_json.h) | [文档](src/nw_json.h.md) | header-only 极简 JSON（解析+序列化，容忍注释/BOM） |\n| [nw_package.h](../src/nw_package.h) | [文档](src/nw_package.h.md) | `Manifest` 结构与路径/编码工具函数声明 |\n| [nw_package.cpp](../src/nw_package.cpp) | [文档](src/nw_package.cpp.md) | package.json 解析、应用目录自动定位、路径规范化 |\n| [nw_script.h](../src/nw_script.h) | [文档](src/nw_script.h.md) | 内置注入脚本两个访问函数的声明 |\n| [nw_script_generated.cpp](../generated/nw_script_generated.cpp) | [文档](src/nw_script_generated.cpp.md) | embed-js.ps1 生成的 JS 内置副本（勿手改） |\n| [nw_script_stub.cpp](../src/nw_script_stub.cpp) | [文档](src/nw_script_stub.cpp.md) | 内置副本缺失时的空实现占位 |\n\n### 2. 页面注入脚本（JS，随每个窗口注入）\n\n| 源文件 | 文档 | 一句话职责 |\n|---|---|---|\n| [js/api/00_base.js](../js/api/00_base.js) | [文档](api/00_base.js.md) | 三条同步通道探测 + rpc/rpcAsync/tell + Emitter + 编码工具 |\n| [js/api/10_api_nw_app.js](../js/api/10_api_nw_app.js) | [文档](api/10_api_nw_app.js.md) | nw.App：manifest/argv/dataPath/quit/代理空实现/全局热键 |\n| [js/api/15_api_nw_internal.js](../js/api/15_api_nw_internal.js) | [文档](api/15_api_nw_internal.js.md) | 对应 SDK 的 binding 层：internalRead/ReadSafe/Tell |\n| [js/api/20_api_nw_window.js](../js/api/20_api_nw_window.js) | [文档](api/20_api_nw_window.js.md) | nw.Window 与 WindowState：全部窗口方法、open 排队结算 |\n| [js/api/40_api_nw_menuitem.js](../js/api/40_api_nw_menuitem.js) | [文档](api/40_api_nw_menuitem.js.md) | MenuItem 构造器与菜单树 JSON 序列化（分配回调 id） |\n| [js/api/41_api_nw_menu.js](../js/api/41_api_nw_menu.js) | [文档](api/41_api_nw_menu.js.md) | Menu（menubar/popup）、点击回调入口 |\n| [js/api/50_api_nw_clipboard.js](../js/api/50_api_nw_clipboard.js) | [文档](api/50_api_nw_clipboard.js.md) | 剪贴板读写（text/html/png/rtf，base64 约定） |\n| [js/api/51_api_nw_shell.js](../js/api/51_api_nw_shell.js) | [文档](api/51_api_nw_shell.js.md) | openExternal/openItem/showItemInFolder/beep |\n| [js/api/52_api_nw_screen.js](../js/api/52_api_nw_screen.js) | [文档](api/52_api_nw_screen.js.md) | 显示器枚举缓存与 displayBoundsChanged |\n| [js/api/53_api_nw_shortcut.js](../js/api/53_api_nw_shortcut.js) | [文档](api/53_api_nw_shortcut.js.md) | 全局热键注册/注销与回调注册表 |\n| [js/api/54_api_nw_tray.js](../js/api/54_api_nw_tray.js) | [文档](api/54_api_nw_tray.js.md) | 托盘图标：异步创建、图标排队、右键菜单 |\n| [js/api/90_install.js](../js/api/90_install.js) | [文档](api/90_install.js.md) | 缝出 window.nw、接 native 事件、window.open 接管 |\n| [nw_node.js](../js/nw_node.js) | [文档](src/nw_node.js.md) | 纯 JS CommonJS 运行时（require/Buffer/fs/path/process…） |\n| [nw_api.js](../archive/nw_api.js) | [文档](src/nw_api.js.md) | **历史旧版**单体页面脚本，已被 js\\api\\ 拆分取代（当前不参与运行） |\n\n### 3. 构建与工具\n\n| 源文件 | 文档 | 一句话职责 |\n|---|---|---|\n| [build-nw.bat](../build-nw.bat) | [文档](build/build-nw.bat.md) | zig 编译 nw.exe、生成内置脚本、拷贝 api JS 与内核 dll |\n| [tools/embed-js.ps1](../tools/embed-js.ps1) | [文档](build/embed-js.ps1.md) | 把 js\\api\\*.js + js\\nw_node.js 切片成 C++ 字符串数组 |\n| tools/build-doc-index.ps1 | 无单篇（见脚本头注释） | 把 mb-docs 全部 .md 打包成离线单页 [index.html](index.html)；文档增删改后重跑 |\n| [archive/split_api.py](../archive/split_api.py) | [文档](build/split_api.py.md) | 一次性重构脚本：把旧 nw_api.js 拆成 js\\api\\ 多模块 |\n\n### 4. 测试（tests\\）\n\n- [00 · 测试总览](tests/00-测试总览.md) 先看这篇，再看各脚本文档：\n\n| 类型 | 文档 |\n|---|---|\n| 🏁 驱动脚本 | [run-smoke.bat](tests/run-smoke.bat.md) · [run-title.bat](tests/run-title.bat.md) · [run-window.bat](tests/run-window.bat.md) · [window_probe.ps1](tests/window_probe.ps1.md) · [run-fsapp.bat](tests/run-fsapp.bat.md) · [run-fsapp-auto.bat](tests/run-fsapp-auto.bat.md) |\n| 🧪 被测应用 | [smoke 应用](tests/app-smoke.md) · [title 应用](tests/app-title.md) · [fsapp 应用](tests/app-fsapp.md) |\n\n### 5. 上游参考原件（reference\\，只读对照，不参与编译）\n\n- [00 · reference 总览](reference/00-extracted总览.md)：cc（C++ 原件）/ idl（接口定义）/ js（SDK 页面脚本）三组对照说明。\n\n---\n\n## 三、想搞懂架构怎么跑起来？\n\n直接进 **[00 · 架构总览（模块索引 + 流程图）](00-架构总览.md)**：\n\n1. 上半部分是**模块索引**：九个模块各自的职责与边界，以及模块内每个文件的清单（一句话说明）；\n2. 下半部分是**五张流程图**：进程启动链、页面↔native 四条通道、命令路由、线程模型、一次窗口操作往返；\n3. 想挖细节时，点每篇文档顶部的\"源文件\"链接直达真实代码。\n"},{"p":"src/nw_api.js.md","g":"native (C++/JS core)","t":"nw_api.js（根目录）—— 历史旧版单体页面脚本，当前不参与运行","m":"# nw_api.js（根目录）—— 历史旧版单体页面脚本，当前不参与运行\n\n- 源文件：[nw_api.js](../../archive/nw_api.js)（约 32KB）\n- 状态标注：**这是拆分前的旧单体版本，保留作历史参考；当前构建与运行都不再读取它。**\n\n## 来龙去脉\n\n- 早期页面侧 nw.* 全部代码都在这一个文件里（约 700 行）：通道层 + App/Window/Menu/MenuItem/Clipboard/Shell/Screen/Shortcut/Tray + 装配层；\n- 后来用一次性脚本 [archive/split_api.py](../build/split_api.py.md) 按 nw.js SDK 的模块边界把它拆成了\n  [js/api/](../../js/api/) 目录下的 12 个模块（拆分时还做了\"反向拼回逐行比对\"的自检，证明搬家没丢语句）；\n- 拆分后：\n  - 运行时 `Host::LoadScripts()` 只枚举 exe 旁边的 `api\\*.js`（`AssembleApiModules`），**不再读本文件**；\n  - 内置副本由 [embed-js.ps1](../build/embed-js.ps1.md) 从 `api\\` 目录生成，也不含本文件；\n  - [build-nw.bat](../build/build-nw.bat.md) 还会主动删除遗留的 `bin\\nw_api.js`，避免出现\"第二份错误事实源\"。\n\n## 为什么文档里仍收它\n\n- 它记录了通道设计的演进痕迹（文件头还在描述\"同步 XHR 打 nmb-rpc:// 是唯一同步路径\"的更早阶段，与现在\n  \"loopback 为主、prompt/XHR 为退路\"的架构已不一致——阅读时以 [js/api/00_base.js](../api/00_base.js.md) 与\n  [00-架构总览](../00-架构总览.md) 为准）；\n- 查某段逻辑的演变历史时可以对照它与拆分后模块。\n\n## 想改页面行为该改哪里\n\n改 [js/api/](../../js/api/) 下对应模块（索引见 [mb.md](../mb.md) 第二节），**不要改本文件**，改了也不会生效。\n"},{"p":"src/nw_host.cpp.md","g":"native (C++/JS core)","t":"nw_host.cpp —— 宿主全部实现（项目最大的文件）","m":"# nw_host.cpp —— 宿主全部实现（项目最大的文件）\n\n- 源文件：[nw_host.cpp](../../src/nw_host.cpp)（约 2300 行）\n- 角色：实现 [nw_host.h](nw_host.h.md) 的 `Host` 与所有内核回调。**浏览器内核与页面 nw.* API 之间的那一层**：窗口生命周期、命令路由、十组 nw/node API 的 native 实现、三条同步通道中的两条半（prompt、XHR 拦截）与异步通道。渲染/排版/网络不在这里，全归内核。\n\n## 文件结构地图（按行序）\n\n### A. 全局设施（匿名命名空间）\n- `kWndClass`：Win32 框架窗口类名 `NwBridgeHostFrame`；\n- `g_viewToWindow` + `g_viewMutex`：内核视图只允许绑一个 param，回调里靠它反查 `NwWindow*`（`WindowOf/BindView`，加锁）；\n- `g_trays/g_nextTrayId`：托盘登记表（id 从 1000 起）；\n- **线程拓扑原子量**：`g_threadMain/g_threadUi/g_threadSync` 记录三个线程的实测 TID；\n  `enum class SyncTransport { Unknown, Prompt, XhrHook, Loopback }` + `g_syncTransport`。\n  `SyncChannelSharesUiThread()` **仅当 transport==Prompt** 才比较 TID——loopback worker / XhrHook 即使 TID 撞号也绝不放行 UI 命令；\n- 工具：`Narrow`（宽→UTF8）、`QuoteForJs`（拼进注入脚本的 JS 字符串转义）、`Base64Encode/Decode`、`HexDigit/PercentDecode`、`ParseAccelerator`（把 `Ctrl+Shift+A` 解析成修饰键+VK）。\n\n### B. 内核回调\n- `OnJsQuery`：**异步通道**入口。记 UI TID → 找窗口 → `Dispatch(Channel::Async)` → `mbResponseQuery` 应答；\n- `OnLoadUrlBegin`：**同步 XHR 拦截退路**。对每个资源加载都会回调（mb108 上还恰好在 UI 线程），所以只有确认拦截到 RPC（`file:` 中的 `/__nmb_rpc__/`、`nmb-rpc:` scheme、`http://nmb-rpc/` 前缀）才写 transport=XhrHook 和 g_threadSync；解码后 `Dispatch(Channel::Sync)`，用 `mbNetSetData/SetMIMEType/SetHTTPHeaderField` 当场作答（带 CORS/Cache-Control）；\n- `OnPromptBox`：**prompt 兼容退路**。识别前缀 `__nmb_rpc__:`，记 transport=Prompt/UI TID，Dispatch 后 `mbCreateString` 回应答；短于 256 字节填充到 256（规避短串路径的已知竞态）；非本通道的真实 prompt 一律 `*handled=FALSE` 放行；\n- `OnScriptContext`：记 UI TID；主框架新上下文清 `titleOverride`（页面 location.href/链接/重定向都要清，不能只在导航命令里清）→ `InstallScripts`；\n- `OnDocumentReady`：再注入一次（幂等）；\n- `OnTitleChanged`/`OnUrlChanged`：主框架变化 → 转成 `__title/__url` 命令回 Dispatch；\n- `OnConsole`：页面 console 转发到 stderr（外部可取证）；\n- `HostWndProc`：框架窗口过程，处理尺寸变化（同步内核子窗口 mbResize）、菜单命令、WM_HOTKEY、托盘消息、WM_CLOSE（问页面 `__nmbCloseVerdict` 可否决）、WM_DISPLAYCHANGE、WM_GETMINMAXINFO（按 min/max 尺寸钳制）等；\n- `ApplyFullscreen/ApplyKiosk`：全屏（保存矩形/样式，吃边框）与 kiosk（先置顶后全屏，顺序反了会闪一帧）。\n\n### C. Host 生命周期\n- `PreparePaths`：确定 exe/应用/用户数据目录；\n- `Start`：LoadKernel → LoadManifest → LoadScripts → **RpcServer::Start**（失败只打 stderr，退回 prompt）→ 注册窗口类等；RPC handler lambda：标 Loopback + 记 worker TID → 按路径 windowId `Find()` → 解码 → `Dispatch(Channel::Sync)`；\n- `Run`：GetMessage 标准循环；`Quit`：PostQuitMessage；**`Shutdown`：`RpcServer::Stop()`**（join 全部线程，防退出后 worker 踩单例）；\n- `WakeAll`：对所有视图 mbWake；\n- `InstallScripts`：拼 preamble（`__nwWindowId/__nwNodeEnabled/__nmbPromptAvailable/__nmbRpcPort/__nmbRpcToken/__nmbBootAppReply/__nmbBootProcessReply`，后两者是直接在 native 预跑 app.info/process.info 的结果——绕开 mb108 \"脚本上下文回调内禁止同步 XHR\"）+ api 脚本 + node 脚本，`mbRunJs(闭包内执行)` 注入；\n- `AssembleApiModules`：枚举 exe 旁边 api\\\\*.js，排序、加模块来源注释、包与 embed-js 相同的 IIFE；\n- `LoadScripts`：磁盘版优先，缺失才回落 `BuiltinApiScript/BuiltinNodeScript`；\n- `Find/AllWindows/EvalInWindow(同步/异步)`。\n\n### D. 开窗与关窗\n- `OpenWindow(urlJson, opener)`：按 manifest window 段与传入 config 建框架窗口（位置/尺寸/frame/transparent/置顶/任务栏等），`mbCreateWebView` 建视图、`mbSetHandle` 绑定为真实子窗口，注册全部内核回调，挂菜单，`mbLoadURL`/loadHtml，窗口号入表；`win.create` 命令复用它开子窗；\n- `CloseWindow`：销毁视图、摘绑定、关 HWND、清托盘/热键。\n\n### E. 命令路由（桥的入口）\n- `BlinkReentrancyUnsafe`：`win.eval/loadURL/reload/back/forward/canGoBack/canGoForward/create/devtools` 永远不许走同步通道（会在 Blink 嵌套调用栈里重入它）；\n- `SyncSafeCommand`：任意线程可跑白名单 `app.info`、`fs.`、`process.`、`clipboard.`、`screen.`、`shell.`、`win.state`；其余 UI 命令需 `SyncChannelSharesUiThread()`；\n- `Dispatch`：解析 JSON 取 `c`；同步通道先过两道闸门；`__title/__url` 内联处理（title_override 判定后 SetWindowText，并把\"生效值\"通过 `__nmbEvent` 推页面）；再按前缀分派到下面 10 组；未知命令 Fail；\n- 信封：`Host::Ok(v)`→`{\"s\":\"ok\",\"v\":...}`，`Host::Fail(m)`→`{\"s\":\"err\",\"m\":...}`。\n\n### F. 十组 API 实现（每组都是\"解 JSON → 调 Win32/内核 → 回 JSON\"）\n\n| 实现函数 | 处理的命令（摘自源码，按出现序） |\n|---|---|\n| `ApiApp` | `app.info`（清单/argv/dataPath/线程拓扑）、`app.quit/exit/restart/crash/registerEvents` |\n| `ApiWindow`（约 50 个） | `win.list/create/close/show/hide/focus/blur/minimize/restore/maximize/unmaximize/fullscreen/leaveFullscreen/moveTo/resizeTo/setTitle/setResizable/setAlwaysOnTop/eval/state/devtools/setZoom/loadURL/reload/back/forward/canGoBack/canGoForward/enterKiosk/leaveKiosk/toggleKiosk/setMinimumSize/setMaximumSize/setPosition/requestAttention/setShowInTaskbar/setProgressBar(ITaskbarList3)/setBadgeLabel/setVisibleOnAllWorkspaces/canSetVisibleOnAllWorkspaces/setIgnoreMouseEvents/setTransparent/capturePage(PrintWindow+RGBA)/getPrinters(EnumPrintersW)/print` |\n| `ApiMenu` + `BuildMenuItems` | `menu.set/create`（建 HMENU，递归子菜单，点击 id 与页面注册表一一对应）、`menu.clear/popup(TrackPopupMenu)/setLabel` |\n| `ApiTray` | `tray.create`（Shell_NotifyIcon + LoadImage 图标）、`setTooltip/setIcon/remove`；点击经 `__nmbTrayEvent` 回页面 |\n| `ApiClipboard` | `clipboard.write/read/clear/availableTypes`。`OpenClipboardRetry` 带重试；text→CF_UNICODETEXT、html→CF_HTML（头部由 native 回填/剥离）、png/rtf→注册格式 + base64 |\n| `ApiShell` | `shell.openExternal/openItem/showItemInFolder/beep`（ShellExecuteW/MessageBeep） |\n| `ApiScreen` + `EnumScreenProc` | `screen.screens`：EnumDisplayMonitors 枚举每块屏的 bounds/scale/主显标志 |\n| `ApiFs` | node 桥文件后端：`fs.exists/stat/readFile/writeFile/appendFile/readdir/mkdir/unlink/rename/realpath`（应用根内相对路径解析，utf8/base64 两种线格式） |\n| `ApiProcess` | `process.info`（platform/arch/cwd/argv/env/versions/pid/appPath）、`process.chdir/exit` |\n| `ApiShortcut` | `shortcut.register/unregister/unregisterAll`：RegisterHotKey 绑窗口线程，WM_HOTKEY 经 `__nmbHotkey` 回页面 |\n\n## 关键设计约束（读这个文件时必须记住）\n\n1. 同步通道能做什么由 native 两道闸门决定，页面侧 [15_api_nw_internal.js](../api/15_api_nw_internal.js.md) 只做镜像对账，不掌握最终决定权；\n2. 标题/URL 推给页面的永远是**生效值**（setTitle 之后页面读 win.title 必须等于标题栏）；\n3. 凡是需要页面回调的（菜单点击、热键、托盘、新窗口、关闭否决）都通过 EvalInWindow 调约定的 `window.__nmb*` 入口，这些入口在 [90_install.js](../api/90_install.js.md) 与各模块里挂接。\n"},{"p":"src/nw_host.h.md","g":"native (C++/JS core)","t":"nw_host.h —— 宿主的接口与数据结构声明","m":"# nw_host.h —— 宿主的接口与数据结构声明\n\n- 源文件：[nw_host.h](../../src/nw_host.h)\n- 角色：声明全局宿主 `Host` 单例、一个窗口的全部状态 `NwWindow`、启动参数 `HostOptions`、通道枚举 `Host::Channel`、托盘表 `TrayEntry`。实现见 [nw_host.cpp](nw_host.cpp.md)。\n\n## 关键结构\n\n### `struct HostOptions`\n启动入参：`appPath`（空=自动找）、`args`（不含 exe 名的命令行）、`kernelPath`（空=LoadKernel 自己找）、`disableNode`。\n\n### `struct NwWindow`\n**一个 nw 窗口 = 一个 Win32 框架窗口（HWND）+ 一个内核视图（WebView）+ 一份 nw.Window 状态。**\n字段即能力清单：\n- 身份/句柄：`id`、`hwnd`、`view`、`opener`、`ownsView`；\n- 窗口形态：`frameless`、`fullscreen`、`kiosk`（= 全屏+置顶）、`maximized/minimized/closing`、`alwaysOnTop/onTopSetByUser`、`resizable`、`showMenuBar`、`nodeEnabled`；\n- 几何：`savedRect/savedStyle`（全屏/最大化前保存）、`minW/minH/maxW/maxH`（setMinimum/MaximumSize 镜像，0 不限；WM_GETMINMAXINFO 拦拖拽 + 编程式 resize 两处都钳）；\n- 标题：`title`、`titleOverride`（页面 setTitle 后 document.title 不再覆盖标题栏，直到新文档——即 nw.js 的 title_override）；\n- 其它镜像：`zoom`（内核只有 setZoomFactor 没有 get，win.state 报的是这里自记的值）、`url`、`menu`（HMENU）、`hotkeys`（热键 id → JS 回调名）；\n- `apiScript`：该窗口的注入脚本原文（每窗口一份，因要带窗口号）。\n\n### `class Host`（单例，`Instance()`）\n- 生命周期：`Start()` / `Run()`（消息循环）/ `Quit(exitCode)` / **`Shutdown()`**（停 RpcServer，join 线程）；\n- 只读访问器：`manifest()`、`kernel()`、`instance()`、`appPath()`、`args()`、`nodeEnabled()`；\n- 窗口：`OpenWindow(urlJson, opener)` 返回窗口号（0 失败）、`CloseWindow(id)`、`Find(id)`、`AllWindows()`；\n- 脚本：`EvalInWindow(id, code)`（不等结果）、`EvalInWindowSync(id, code)`、`InstallScripts(window, frame)`、`RootApiScript()`；\n- **通道入口**：`Dispatch(window, requestJson, Channel)`——页面→native 所有 JSON 命令的唯一收口；\n  - `enum class Channel { Async, Sync }`：Async=mbQuery 回调在 UI 线程可碰 HWND；Sync=同步通道，线程语义依运输层而定，只许碰数据白名单；\n- 应答信封：静态 `Ok(Json)` / `Fail(message)`；\n- 私有 10 组 API：`ApiApp / ApiWindow / ApiMenu / ApiTray / ApiClipboard / ApiShell / ApiScreen / ApiShortcut / ApiFs / ApiProcess`；\n- 私有状态：内核、manifest、路径（`dataPath_` 对应用户数据目录）、窗口表 `map\u003cint, unique_ptr\u003cNwWindow\u003e\u003e`、`nextWindowId_`（从 1 起）、`apiScript_`/`nodeScript_`、退出码与退出标志。\n\n### `struct TrayEntry` + `FindTray(id)`\n托盘是\"没有窗口也要活着\"的进程级资源：`id`、所属窗口、`NOTIFYICONDATAW`、加载的 `HICON`（销毁时要 DestroyIcon）。\n\n## 编译注意（文件头注释）\n\n`_WIN32_WINNT=0x0601`、`NTDDI_VERSION=0x06010000` 必须在任何 Windows 头之前定义：mingw-w64 的 shellapi.h 里 `NOTIFYICONDATAW` 成员随版本变化；并显式 `#include \u003cshellapi.h\u003e`（WIN32_LEAN_AND_MEAN 会把它从 windows.h 摘掉）。\n"},{"p":"src/nw_json.h.md","g":"native (C++/JS core)","t":"nw_json.h —— 极简 JSON（header-only）","m":"# nw_json.h —— 极简 JSON（header-only）\n\n- 源文件：[nw_json.h](../../src/nw_json.h)\n- 角色：宿主侧所有 JSON 的解析与序列化。用途三处：读 package.json、解析页面发来的请求负载、拼应答信封。\n- 为什么自带：nw.js 用 Chromium 的 `base::JSONReader/base::Value`；本模块没有 base，也不想为这点需求再拉一个 JSON 依赖。\n\n## 能力边界\n\n标准 JSON 子集：`null/bool/number/string/array/object`；支持 `\\uXXXX`（含高/低代理对合并成一个码点再编码 UTF-8）、常见转义；object 用 `vector\u003cpair\u003e` 保存，**保持插入顺序**。\n\n## 主要接口（class Json）\n\n- 工厂：`object()/array()/fromText/fromNumber/fromBool`；类型判断 `isObject/isArray/...`；\n- 写：`push`（数组）、`put(key, Json)`（同键覆盖）、`putString/putNumber/putBool`；\n- 读：`find(key)` 指针；\n  - `text(key, fallback)`：**容错取值**——字符串原样、数字转干净文本、bool 转 \"true\"/\"false\"；\n  - `asText()` 是\"对自身取值\"版本（必须换名，否则 `text(\"c\")` 与单参 fallback 版在 cl/clang 下 ambiguous）；\n  - `boolean(key, fallback)`：bool/数字/字符串 \"true\"/\"1\" 都认；`number(key, fallback)`：数字/字符串(atof)/bool 都认。\n  - 这种\"类型不对就退回落值/再按字符串试一次\"的宽容是刻意的：manifest 是用户手写文件，`\"width\": \"800\"` 比缺键更常见；\n- `parse(text, out)`：递归下降解析（parseValue/Object/Array/String，strtod 解析数字）。**尾部多余内容忽略**（manifest 常带注释残渣/BOM 尾巴）；\n- `dump()`/`write()`：序列化。字符串只转义 `\"`、`\\`、控制字符，中文按 UTF-8 原样写出（页面 JSON.parse 认，且 mbQuery 负载更短）。\n\n## 两个细节\n\n- `skipSpace` 额外放行 `//` 与 `/* */` 注释——真实项目 manifest 里经常带注释；\n- `trimNumber(double)`：用 `%.6f` 再删尾随 0，避免窗口坐标写出 `100.00000000000001`；NaN/非有限值一律输出 `0`（不允许把 inf 写进 JSON）。\n"},{"p":"src/nw_kernel.cpp.md","g":"native (C++/JS core)","t":"nw_kernel.cpp —— 加载 miniblink 内核并绑定全部导出","m":"# nw_kernel.cpp —— 加载 miniblink 内核并绑定全部导出\n\n- 源文件：[nw_kernel.cpp](../../src/nw_kernel.cpp)\n- 角色：实现 [nw_kernel.h](nw_kernel.h.md) 声明的 `LoadKernel/UnloadKernel/RunJsSync`。宿主启动的第一步硬依赖：找不到内核或缺必需导出就直接启动失败。\n\n## 干了什么事\n\n### 1. 定位候选 dll：`KernelCandidates(explicitPath)`\n按优先级产出一组路径：\n1. `--nw-kernel=` 显式值本身；若是目录，再试其下 `mb108_x64.dll`、`mb132_x64.dll`；\n2. 环境变量 `NMB_MINIBLINK`；\n3. exe 同目录的 `mb108_x64.dll` / `mb132_x64.dll`；\n4. exe 目录 `\\miniblink\\` 下两个名字；\n5. exe 目录 `\\..\\NativeMediaBridge\\bin\\` 下两个名字；\n6. 裸 dll 名交给系统按 PATH/当前目录找。\n\n`LoadLibraryExW(..., LOAD_WITH_ALTERED_SEARCH_PATH)`：内核旁边通常有自己的依赖（icudtl、node 等），必须先在 dll 自己的目录里找依赖。记最后一个非\"文件不存在\"的错误码，报错时带 `GetLastError`。\n\n### 2. 取导出：模板 `Take(module, name, target, missing, required=true)`\n- 必需导出缺失 → 名字进 `missing`，最后汇总成\"内核 xxx 缺少必需导出：…\"，卸载并失败；\n- 可选导出缺失只是少功能（通知、透明、缩放、prompt 链等），不影响宿主成立；\n- 必需链包括：init/webview/handle/load/runJs/jsQuery/responseQuery/documentReady/scriptContext/wake/focus/主帧/isMainFrame/debugConfig/新窗口开关，以及同步 XHR 退路的 `mbOnLoadUrlBegin + mbNetSetData + mbNetSetMIMEType`；\n- 可选链含 `mbOnPromptBox/mbCreateString/mbDeleteString/mbGetString`（prompt 退路）、导航/历史/标题/URL/console/close/createView、CORS 头与 netHookRequest 等。\n- 取导出必须从**实际加载的模块**取（保存于 `g_kernelModule`），不能把 dll 名写死——mb108/mb132 文件名不同但核心 ABI 同组。\n\n### 3. `mbInit` 全局一次\n`g_kernelInitialized` 守门：重复 mbInit 会让内核状态错乱。用 `mbCreateInitSettings()` 出默认设置后 `mbInit(settings)`。\n\n### 4. `RunJsSync(view, code)`\n- 用 `GetProcAddress` 懒取 `mbRunJs` 与 `mbWebFrameGetMainFrame`；\n- 在**调用线程**上发起，内核会在本线程同步跑完脚本并回调 `OnRunJsDone`；\n- `OnRunJsDone` 内再用 `mbJsToString(es, value)` 把 JsValue 换成字符串，null/undefined → 空串；\n- 用栈上的 `SyncRun{result, ran, depth}` 接结果。注释明确警告：不要改成投到别的线程等信号量，那样会跑错到内核非 GUI 线程。\n\n### 5. `UnloadKernel`\n先摘掉 `g_kernelModule` 再 `FreeLibrary`，清空结构。\n\n## 与谁协作\n\n- 被 [nw_host.cpp](nw_host.cpp.md) 的 `Host::Start()` 调用一次；\n- 错误信息经 `Utf8ToWide`（[nw_package.cpp](nw_package.cpp.md)）转成宿主内部宽字符。\n"},{"p":"src/nw_kernel.h.md","g":"native (C++/JS core)","t":"nw_kernel.h —— miniblink 内核 ABI 面","m":"# nw_kernel.h —— miniblink 内核 ABI 面\n\n- 源文件：[nw_kernel.h](../../src/nw_kernel.h)\n- 角色：把 mb108/mb132 内核 dll 的裸 C 导出收敛成一个 `KernelApi` 结构（一组函数指针），并声明需要的回调签名、`LoadKernel/UnloadKernel/RunJsSync`。加载与取导出的实现在 [nw_kernel.cpp](nw_kernel.cpp.md)。\n\n## 干了什么事\n\n### 回调 typedef（宿主实现，注册给内核）\n- `JsQueryCallback`：页面调 `mbQuery` 时内核回调（**异步通道**落点 `OnJsQuery`）；\n- `LoadUrlBeginCallback`：每个资源加载前回调（同步 XHR 退路 `OnLoadUrlBegin` 的落点；返回 TRUE=本请求宿主接管）；\n- `PromptBoxCallback`：`window.prompt` 同步回调（**兼容退路**；主通道已是 loopback HTTP）；\n- `CloseCallback`、`CreateViewCallback`（新窗口请求）、`DocumentReadyCallback`、`ScriptContextCallback`（两个注入时机）、`UrlChangedCallback`、`TitleChangedCallback`、`ConsoleCallback`；\n- `RunJsCallback`：`mbRunJs` 的同步结果回调。\n- 不透明句柄：`WebView`、`Frame`、`JsExec`、`JsValue`。\n\n### `struct KernelApi`\n函数指针**按职责分组**，全部默认初始化为空指针：\n- 生命周期/视图：`createInitSettings`、`init`、`createWebView`、`createWebWindow`、`destroyWebView`、`setHandle`、`resize`、`showWindow`；\n- 导航/脚本：`loadURL`、`loadHtmlWithBaseUrl`、`runJs`、`jsToString`、`reload/stopLoading/goBack/goForward/canGoBack/canGoForward`、`getURL/getTitle/getSize`；\n- query 通道：`onJsQuery`、`responseQuery`；\n- **同步通道三条链的导出**：`onLoadUrlBegin` + `netSetData/netSetMIMEType/netSetHTTPHeaderFieldUtf8/netContinueJob/netHookRequest`；以及退路用的 `onPromptBox` + `createString/deleteString/getString`（mbCreateString/mbDeleteString/mbGetString）；\n- 注入时机/通知：`onDocumentReady`、`onDidCreateScriptContext`、`onURLChanged`、`onTitleChanged`、`onConsole`、`onClose`、`onCreateView`；\n- 杂项开关：`setDebugConfig`、`setNavigationToNewWindowEnable`、`setHandleOffset`、`setAutoDrawToHwnd`、`setTransparent`、`setZoomFactor`、`setUserAgent`、`setCspCheckEnable`、`wake`、`setFocus/killFocus`、`webFrameGetMainFrame`、`isMainFrame`。\n- 另存 `HMODULE module` 与实际加载路径 `std::wstring path`。\n\n### 顶层函数\n- `LoadKernel(dllPath, out, error)` / `UnloadKernel(api)`；\n- `RunJsSync(view, code)`：在本线程立刻跑脚本并从回调拿回字符串结果。\n\n## 设计要点（文件头注释）\n\n内核没有任何\"同步绑定 JS 函数\"的导出（mb132 时代 wkeJsBindFunction 已删），mbQuery 应答又是异步投递，所以文件头把三条同步候选的来源写得很明确：① loopback HTTP（主，见 [nw_rpc.h](nw_rpc.h.md)）；② prompt（退路，createString 回程有内核级竞态）；③ onLoadUrlBegin 拦截（更老内核退路）。\n"},{"p":"src/nw_main.cpp.md","g":"native (C++/JS core)","t":"nw_main.cpp —— 进程入口","m":"# nw_main.cpp —— 进程入口\n\n- 源文件：[nw_main.cpp](../../src/nw_main.cpp)\n- 角色：**nw.exe 的 `main()`**。整个进程只做三件事：解析命令行、起宿主、进消息循环。\n- 对应 nw.js 原版：`content::BrowserMainRunner` + `nw::NWAppMainDelegate`（几百行拉 Chromium）；本项目把浏览器外包给 miniblink，所以入口只剩几十行。\n\n## 干了什么事（按执行顺序）\n\n1. `SetProcessDPIAware()`：声明系统 DPI 感知，高分屏不被系统拉伸发虚。刻意用老接口而非 `SetProcessDpiAwarenessContext`（后者要 Win10 头文件，此处无需）。\n2. `SplitCommandLine()`：`GetCommandLineW` + `CommandLineToArgvW` 拆宽字符参数，跳过 argv[0]（exe 自己）。\n3. 遍历参数填 `nmb::nw::HostOptions`：\n   - `--nwapp=\u003c目录\u003e` → `options.appPath`\n   - `--nw-kernel=\u003c路径或目录\u003e` → `options.kernelPath`（交给 LoadKernel 决定是 dll 还是目录）\n   - `--nw-no-node` → `options.disableNode = true`（等价 manifest `nodejs:false`）\n   - `--nw-no-dialog` → 本文件静态变量 `g_noDialog`：启动失败只写 stderr，**不弹模态框**——自动化测试/CI 必须有它，否则进程挂死等点击。\n   - 若没给 `--nwapp`，第一个不以 `-` 开头的参数也当应用目录（与 `nw.exe path\\to\\app` 用法一致）。\n4. `Host::Instance().Start(GetModuleHandleW(nullptr), options, error)`；失败调 `ShowError()`（OutputDebugString + stderr，非 no-dialog 时 MessageBox），返回 1。\n5. `Host::OpenWindow(std::string(), nullptr)` 开主窗（空 URL = 用 manifest 的 main）；失败返回 2。\n6. `int exitCode = host.Run()`（Win32 消息循环）；**`host.Shutdown()`** 在返回前同步停掉 loopback RPC（join 全部 accept/worker 线程），最后 `return exitCode`。\n\n## 为什么用普通 main 而不是 wmain\n\n源码注释明确：wmain 需要 `-municode` 换入口点，而参数本就从 `GetCommandLineW` 取，没必要多担一个编译开关（zig/mingw 兼容考虑）。\n\n## 协作关系\n\n- 只依赖 [nw_host.h](../../src/nw_host.h)（`Host`、`HostOptions`）；\n- 宽字符转 UTF-8 用的是 `nmb::nw::WideToUtf8`（实现在 [nw_package.cpp](../../src/nw_package.cpp)）。\n"},{"p":"src/nw_node.js.md","g":"native (C++/JS core)","t":"nw_node.js —— 页面侧 node 桥（纯 JS CommonJS 运行时）","m":"# nw_node.js —— 页面侧 node 桥（纯 JS CommonJS 运行时）\n\n- 源文件：[nw_node.js](../../js/nw_node.js)（约 28KB）\n- 角色：在页面里提供 nw 应用常用的 node 能力。**它是\"桥\"不是真 node**：nw.js 真的把 V8(node) 塞进 renderer，能加载原生扩展、跑 npm 原生包；本实现没有 renderer 也不拖 node 进来，这里是 CommonJS 运行时 + 常用内置模块的纯 JS 实现，凡要落到操作系统的原语（文件/环境/进程）都通过同步通道（`window.__nmbRpc`）回到 native 的 `ApiFs/ApiProcess`。\n\n## 边界（文件头明示）\n\n- 有：`require`（含 node_modules 逐级解析、package.json main、.json 加载、缓存）、`module/exports`、`process`、`Buffer`、`path`、`fs`（同步 API）、`os`、`url`、`querystring`、`events`、`util`、`assert`、`timers`；\n- 没有：原生扩展（.node）、child_process、net/tls/dgram/http 服务端、worker_threads，以及依赖它们的 npm 包；\n- 页面的 `nw.require` / 全局 `require` 就是这里的 require。\n\n## 干了什么事（按段落）\n\n1. **启动信息**：优先用 native 预注入的 `window.__nmbBootProcessReply`（mb108 在脚本上下文回调内不能发同步 XHR）；没有再 `rpc(\u0027process.info\u0027)`；同步通道不通则退化成空壳并把原因记进 `window.__nmbNodeError`，不拖垮 window.nw。\n2. **Buffer**：手写 base64 编解码；Buffer 按\"Uint8Array 子类同形状\"实现；`toString` 按编码解码，并显式处理裸 Uint8Array 的 toString 差异（只改 BufferArg 的原型链，不改全局 Uint8Array）。\n3. **path**：node path 的 win32 语义（join/resolve/dirname/basename/extname/normalize 等），手写。\n4. **process**：platform/arch/cwd/argv/env/versions/pid 来自 process.info；含 cwd/exit 等桥接口。\n5. **fs（同步 API）**：`existsSync/statSync/lstatSync/readFileSync/writeFileSync/appendFileSync/readdirSync/mkdirSync/unlinkSync/renameSync/realpathSync` 等，每个都是一条同步 RPC：\n   - 线格式只走 utf8/base64：无 encoding 返回 Buffer（桥以 utf8 回，再转字节）；hex 等编码先按 base64 取字节再本地编；写字节时 base64 上行；\n   - stat 返回带 `isDirectory()/isFile()` 与由 mtimeMs 构造的 Date；错误伪造 node 形状（`code`/`path`，如 ENOENT）。\n6. **其余内置**：os、url、querystring、events（复用 api 层 Emitter 思路）、util、assert、timers（setTimeout 等直接借 window）。\n7. **require 机制**：\n   - `builtins` 表（支持 `node:` 前缀）；\n   - `resolveModule`：相对/绝对路径先找文件（x / x.js / x.json）再找 index；裸模块名从当前目录一路向上找 `node_modules/\u003cname\u003e`，读其 package.json 的 main；\n   - `makeRequire`：moduleCache 缓存；.json 直接 parse；.js 用 `new Function(\u0027exports\u0027,\u0027require\u0027,\u0027module\u0027,\u0027__filename\u0027,\u0027__dirname\u0027, source)` 包一层执行，子 require 以文件所在目录为根；\n   - 暴露 `require.resolve/cache/main/builtins`。\n8. **挂全局**：`window.require/module/exports/global/Buffer/process/__nmbRequire`，并回填 `window.nw.require`；`window.__nmbNode` 给出能力自述（modules、`nativeAddons:false`）。\n\n## 与谁协作\n\n- 必须在 api 脚本之后注入（用 `window.__nmbRpc/__nmbRpcAsync`，缺失会报错并放弃）；\n- native 后端命令见 [nw_host.cpp](nw_host.cpp.md) 的 `ApiFs`（`fs.*`）与 `ApiProcess`（`process.*`），二者都在同步白名单内。\n"},{"p":"src/nw_package.cpp.md","g":"native (C++/JS core)","t":"nw_package.cpp —— 清单解析、应用定位、路径与编码工具（实现）","m":"# nw_package.cpp —— 清单解析、应用定位、路径与编码工具（实现）\n\n- 源文件：[nw_package.cpp](../../src/nw_package.cpp)\n- 角色：[nw_package.h](nw_package.h.md) 的实现。宿主启动早期被调用，决定\"跑哪个应用、打开哪个 URL、开不开 node\"。\n\n## 实现的工具函数（被全项目复用）\n\n- `WideToUtf8 / Utf8ToWide`：`WideCharToMultiByte/MultiByteToWideChar(CP_UTF8)`，两遍分配；\n- `NormalizePath`：斜杠统一为反斜杠 + 就地折叠 `.`/`..`。**三种根分开处理**（盘 `C:`、UNC `\\\\srv`、单反斜杠根），注释记录了踩坑：若按\"结尾是冒号就不加分隔符\"拼接，会把 `C:\\Users\\x` 错拼成盘相对路径 `C:Users\\x`，落到 C: 盘当前目录；\n- `PercentEncodePath`：file:// 路径里的非安全字符按 UTF-8 百分号编码。mbLoadURL 只吃 UTF-8，应用目录带空格/中文（如 `F:\\编程\\...`）时不编码会加载失败；\n- `JoinPath`：叶子是盘绝对/UNC 时直接覆盖；否则拼 base + `\\` 后统一 Normalize；\n- `PathExists/IsDirectory`（GetFileAttributesW）、`ReadTextFile`（CreateFile 读，限 64MB，**剥除 UTF-8 BOM**——不剥会让 JSON 解析在第一个字符就失败）；\n- `ExecutablePath/ExecutableDirectory`（GetModuleFileNameW 倍增缓冲）；\n- `ToFileUrl`：相对路径先相对当前目录转绝对，再 Normalize，UNC 用 `file:`，其余 `file:///` + 百分号编码；\n- `HasScheme/ResolveMain`：判断 main 是否完整 URL；相对 main 拼成应用目录下的 file://；\n- `Tokenize`：按空格/引号拆 chromium-args（nw.js 用 base::StringTokenizer + 单引号 quote）；\n- `CollectChromiumArgs`：`NW_PRE_ARGS` 在前、manifest `chromium-args` 在后，只采纳 `-x/--x` 开关形式，裸参数丢弃。\n\n## `LoadManifest(path, out)` 干的事\n\n1. path 是目录 → 找其中 `package.json`（没有再试 `manifest.json`）；是文件 → 直接用（本实现不支持 .nw 解包）；不存在报错；\n2. `ReadTextFile` + `Json::parse`，必须是 object，否则失败；原文存 `source`；\n3. 取字段：`name(缺省 nwjs)/version/main/nodejs(缺省 true)/single-instance/disable-dev-tools/js-flags/user-agent/chromium-args`；\n4. `window` 段不存在则给空对象并补 `position:\"center\"`（与 nw.js 一致）；\n5. `--url=\u003c...\u003e` 开关优先于 manifest main（无 scheme 时补 `http://`），否则 `ResolveMain(appPath, main)` 得 startupUrl。\n\n## `AutoLocateApp(args, appPath)` 顺序\n\n1. exe 所在目录本身含 package.json/manifest.json（nw.js GetSelfPath 语义）；\n2. exe 旁边的 `package.nw` 目录；\n3. `--nwapp=\u003cdir\u003e`；\n4. 第一个不带 `-`/`/` 开关前缀的参数。\n"},{"p":"src/nw_package.h.md","g":"native (C++/JS core)","t":"nw_package.h —— package.json 清单与路径工具（声明）","m":"# nw_package.h —— package.json 清单与路径工具（声明）\n\n- 源文件：[nw_package.h](../../src/nw_package.h)\n- 角色：声明应用清单结构 `Manifest`、清单加载/应用目录定位两个入口，以及一组 Win32 路径与编码工具。实现见 [nw_package.cpp](nw_package.cpp.md)。移植自 nw.js 的 `src/nw_package.{h,cc}`（原件在 [reference/cc](../reference/00-extracted总览.md)），保留字段名与判定顺序，去掉 Chromium 依赖。\n\n## `struct Manifest` 主要字段\n\n- `ok/error`、`appPath`（应用根目录）、`manifestPath`（package.json 全路径）；\n- `name`（缺省 \"nwjs\"，比 nw.js 宽松）、`version`、`main`（缺省 `nw:blank`）、`startupUrl`（main 解析后的 file:// 或远程 URL）；\n- `chromiumArgs`（环境 `NW_PRE_ARGS` + manifest `chromium-args`，只留开关形式）、`jsFlags`、`userAgent`；\n- `useNode`（manifest `nodejs`，缺省 true）、`singleInstance`、`disableDevTools`；\n- `root`（原始 JSON，供 `nw.App.manifest`）、`window`（window 段，缺省补 `{\"position\":\"center\"}`）、`source`（package.json 原文透传页面）。\n\n## 顶层函数\n\n- `LoadManifest(path, out)`：读并解析应用目录下的 package.json；path 给目录或 manifest 文件均可；\n- `AutoLocateApp(args, appPath)`：按 nw.js 顺序自动找应用（exe 目录 → exe\\package.nw → `--nwapp=` → 第一个非开关参数）；\n- 路径/编码工具：`WideToUtf8/Utf8ToWide`、`JoinPath`、`PathExists/IsDirectory/ReadTextFile`、`ExecutablePath/ExecutableDirectory`、`ToFileUrl`（带 scheme 的输入原样返回）。\n\n## 与原版的差异（头注释明确）\n\n- `base::Value/JSONFileValueDeserializer` → 自带 [nw_json.h](nw_json.h.md)；`base::FilePath/PathService` → Win32 自拼；\n- 不做 zip `.nw` 解包，只认目录形式应用；\n- `CommandLine::AppendSwitch` 简化为把 chromium-args 收进字符串字段。\n"},{"p":"src/nw_rpc.cpp.md","g":"native (C++/JS core)","t":"nw_rpc.cpp —— loopback HTTP RPC 服务（实现）","m":"# nw_rpc.cpp —— loopback HTTP RPC 服务（实现）\n\n- 源文件：[nw_rpc.cpp](../../src/nw_rpc.cpp)\n- 角色：[nw_rpc.h](nw_rpc.h.md) 的完整 WinSock2 实现。被 [nw_host.cpp](nw_host.cpp.md) 的 `Host::Start()` 启动、`Host::Shutdown()` 停止；被页面 [00_base.js](../api/00_base.js.md) 的 `loopbackOnce` 以同步 XHR 访问。\n\n## 常量与数据\n\n- `kMaxHeaderBytes = 64KB`、`kMaxBodyBytes = 32MB`（fs 写可能带较大内容）、收发超时各 `10000ms`；\n- `struct ActiveConn { SOCKET sock; HANDLE thread; }`：在飞连接登记表。**socket 与线程句柄统一由 accept 线程收**（worker 自己不 close），杜绝 shutdown 撞上 fd 复用窗口。\n\n## 各部分干的事\n\n### 令牌：`CryptRandom` + `HexToken`\n- 优先动态 `GetProcAddress(advapi32, \"SystemFunction036\")`（即 RtlGenRandom，XP 起可用）。刻意不静态链接，避免导入库差异成为构建故障点；\n- 取不到才退化到 tick/pid/线程id/性能计数器多源播种的 LCG（Windows 上走不到的理论分支）；\n- `HexToken(32)` → 32 字节随机数的 64 字符十六进制串 = 256bit 令牌。\n\n### 应答：`SendResponse`\n恒带 `Content-Type: text/plain; charset=utf-8`、`Access-Control-Allow-Origin: *`、`Cache-Control: no-store`、`Connection: close`。**错误状态码也带 CORS**，否则跨源 XHR 连错误正文都读不到。`RecvExact` 负责收满 Content-Length 字节。\n\n### `Start()`\nWSAStartup → 建 CRITICAL_SECTION 与连接表 → `socket(AF_INET, SOCK_STREAM)` → **bind `INADDR_LOOPBACK` 端口 0** → listen → `getsockname` 取回实际端口 → 监听 socket 置非阻塞（供 select 轮询）→ 生成令牌、置 running、建 accept 线程。任一步失败走 `fail:` 清理并返回 false（调用方不因此中止启动）。\n\n### accept 循环：`AcceptLoop()`\n1. 每轮先 `ReapFinished()` 收掉已结束的 worker；\n2. `select` 200ms 超时等监听 socket 可读，超时就回头看 `running_`（Stop 最迟 200ms 退出，无需跨线程 closesocket 硬打断 accept——那在 Windows 上是未定义行为）；\n3. accept 后校验 `ntohl(client.sin_addr.s_addr) == INADDR_LOOPBACK`，不是立刻关；\n4. **关键修复（曾导致随机单条 XHR 失败）**：Windows 上 accept 出的 socket **继承监听 socket 的非阻塞模式**；不复位则 worker 的 recv 在数据未到时立刻拿到 `WSAEWOULDBLOCK`，被误判失败且不回应答。这里必须 `ioctlsocket(conn, FIONBIO, 0)` 改回阻塞，再设 `SO_RCVTIMEO/SO_SNDTIMEO`；\n5. 建一次性 worker 线程跑 `HandleConnection`，句柄登记进表（临界区保护）。\n\n### 连接处理：`HandleConnection()`（在 worker 线程）\n- 读到 `\\r\\n\\r\\n` 为止（超 64KB 回 431）；解析请求行 METHOD/TARGET；\n- `OPTIONS` 回 204 + 宽松 CORS（手工 fetch 排查用；同步 XHR 不会发预检）；非 POST 回 405；\n- 只取 `Content-Length`；无 body 回 400、超 32MB 回 413；\n- 路径必须形如 `/w\u003c数字窗口id\u003e(/...)`，否则 404；从 query 解析 `t`，与令牌不符（或令牌为空）一律 **403** 且不回额外细节；\n- 收齐 body（头后已含的部分 + RecvExact 补齐，多余丢弃），调 `handler_(windowId, body)`，回 200 + JSON 信封。handler 为空时回 `{\"s\":\"err\",\"m\":\"RPC 服务未就绪\"}`。\n\n### 收尸：`ReapFinished()`\n零超时 `WaitForSingleObject` 探测登记表里的 worker；已结束的摘出表、由本线程统一 `closesocket` + `CloseHandle`。\n\n### `Stop()`\n置 `running_=false` → join accept 线程（并关监听 socket）→ 临界区内 swap 出全部在飞连接 → 逐个 `shutdown(SD_BOTH)` 打断阻塞中的 recv → `WaitForSingleObject` join → closesocket/CloseHandle → 删临界区、删表、`WSACleanup`、清空端口/令牌/handler。\n**必须在进程退出前同步执行**（Host::Shutdown），否则 worker 可能在 CRT/单例析构后还回调 Dispatch 踩已释放内存。\n"},{"p":"src/nw_rpc.h.md","g":"native (C++/JS core)","t":"nw_rpc.h —— loopback HTTP 同步通道（声明）","m":"# nw_rpc.h —— loopback HTTP 同步通道（声明）\n\n- 源文件：[nw_rpc.h](../../src/nw_rpc.h)\n- 角色：声明 `nmb::nw::RpcServer` 单例——本项目在 mb108 上**主用**的页面→native 同步通道。完整实现见 [nw_rpc.cpp](nw_rpc.cpp.md)。\n\n## 为什么需要它（背景）\n\nmb108 的 prompt 回程存在**内核级竞态**：native 每次都生成正确 JSON、`mbCreateString` 也返回非空句柄，\n内核把句柄带回 JS 的那一步却概率性丢成 null/脏串，页面重试再多也只是赌命中率；\n而同步 XHR + onLoadUrlBegin 在 mb108 上对同步 XHR 不回调。唯一与内核状态机无关的可靠 IPC 就是本机 TCP：\n页面同步 XHR 阻塞在 send()，宿主在自己的 accept 线程当场作答，回程只走标准 socket 字节流。\n\n## 接口\n\n```cpp\nusing RpcHandler = std::function\u003cstd::string(int windowId, const std::string\u0026 payload)\u003e;\n\nclass RpcServer {\n  static RpcServer\u0026 Instance();\n  bool Start(RpcHandler handler, std::string\u0026 error);  // 幂等；失败不致命（页面退回 prompt）\n  void Stop();                                         // join 全部线程、WSACleanup\n  bool running() const;\n  int  port() const;                // 0 = 未监听；OS 随机分配\n  const std::string\u0026 token() const; // 每进程 256bit 随机令牌\n};\n```\n\n## 头注释里写定的安全模型与协议\n\n- 只 `bind 127.0.0.1`：物理上不接受非本机连接，accept 后对端地址再校验一遍；\n- 端口 `bind(port=0)` 由 OS 随机分配，每次启动都不同；\n- 每进程 CSPRNG 生成 256bit 令牌，随注入脚本只交给本进程页面（**不落盘、不进命令行**）；任何请求必须在 query 带对 `t=\u003ctoken\u003e`，否则 403；\n- 仅 POST，载荷大小封顶，收发各带超时；\n- 协议刻意保持 CORS\"简单请求\"（同步 XHR 不能发预检）：\n  `POST http://127.0.0.1:\u003cport\u003e/w\u003cwindowId\u003e/?t=\u003ctoken\u003e`，`Content-Type: text/plain;charset=UTF-8`，\n  body 是与其它通道相同的 `encodeURIComponent(base64(UTF-8(JSON)))`；应答 body 即 JSON 信封，恒带 `Access-Control-Allow-Origin: *`。\n\n## 线程模型\n\naccept 专用线程（非阻塞监听 socket + select 200ms 轮询 `running_`，保证 Stop 快速退出）；每条连接一个一次性 worker 线程，跑完由 accept 循环收尸。worker 不在 UI 线程，handler 只允许数据类命令（native 侧在 handler 里显式标 `SyncTransport::Loopback`，同步白名单兜底）。\n\n## 实现隐藏手法\n\n`listen_/running_` 用 `uintptr_t/volatile`，线程句柄与连接表用 `void*` 持有——把 `\u003cwindows.h\u003e` 的 CRITICAL_SECTION、SOCKET、HANDLE 等全部藏进 .cpp，头文件保持轻依赖（仅 cstdint/functional/string）。\n"},{"p":"src/nw_script.h.md","g":"native (C++/JS core)","t":"nw_script.h —— 内置注入脚本的访问口（声明）","m":"# nw_script.h —— 内置注入脚本的访问口（声明）\n\n- 源文件：[nw_script.h](../../src/nw_script.h)\n- 角色：只声明两个函数，返回\"烤进 exe 的 JS 内置副本\"：\n  - `std::string BuiltinApiScript();`（页面 nw.* 层，即 api\\*.js 拼接体）\n  - `std::string BuiltinNodeScript();`（node 桥 nw_node.js）\n\n## 副本机制（为什么需要）\n\n- 运行期 `Host::LoadScripts()`（[nw_host.cpp](nw_host.cpp.md)）**优先读 exe 旁边的 `api\\*.js` 与 `nw_node.js`**——开发期改脚本不用重编译；\n- 磁盘上读不到时才用这里的内置副本，保证单文件分发也能跑；\n- 内置副本由 [tools/embed-js.ps1](../build/embed-js.ps1.md) 在每次构建时重新生成到\n  [nw_script_generated.cpp](nw_script_generated.cpp.md)；\n- 之所以\"生成\"而非手写字符串：MSVC 单个字符串字面量超过 16380 字节会被静默截断（C2026），\n  必须切成多段相邻原始字面量拼接（脚本总量数十 KB）；\n- 尚未生成过时，编译的是 [nw_script_stub.cpp](nw_script_stub.cpp.md) 的空实现（这种情况下 exe 旁边必须有 JS）。\n"},{"p":"src/nw_script_generated.cpp.md","g":"native (C++/JS core)","t":"nw_script_generated.cpp —— 构建时生成的 JS 内置副本（勿手改）","m":"# nw_script_generated.cpp —— 构建时生成的 JS 内置副本（勿手改）\n\n- 源文件：[nw_script_generated.cpp](../../generated/nw_script_generated.cpp)（约 88KB）\n- 性质：**自动生成产物，不要手工编辑。** 修改页面逻辑请改 [js/api/\\*.js](../../js/api/) 或 [nw_node.js](../../js/nw_node.js)，然后跑 [build-nw.bat](../../build-nw.bat)（它先调 [tools/embed-js.ps1](../build/embed-js.ps1.md) 重新生成本文件）。\n\n## 内容形状\n\n- 文件首行：`// Generated by tools/embed-js.ps1 -- do not edit.`\n- `#include \"nw_script.h\"`，命名空间内实现两个函数：\n  - `BuiltinApiScript()`：把 api\\*.js **按文件名排序拼接**、外层包统一 IIFE（`__nmbInstalled` 幂等守卫）后的完整文本；每段形如 `R\"NWJS(...)NWJS\",`，每片不超过 8000 字符（避开 MSVC C2026 的 16380 字节截断），运行时把各片 `+=` 拼回整串；\n  - `BuiltinNodeScript()`：nw_node.js 全文，同样切片。\n\n## 与运行时的一致性要求\n\n嵌入版与\"exe 旁边磁盘版\"必须行为一致：\n- 拼接顺序（按文件名排序）、IIFE prologue/epilogue 与 [nw_host.cpp](../../src/nw_host.cpp) 里的\n  `kApiPrologue/kApiEpilogue`、`AssembleApiModules()` 保持逐字节相同的包装（embed-js.ps1 注释强调漂移会让两条路径行为分叉）；\n- 每个模块前插入 `// ---- \u003c文件名\u003e ----` 注释行，页面报错时能指认是哪个模块。\n\n## 何时真的会被用到\n\n仅当 exe 旁边没有 `api\\` 目录或缺 `nw_node.js` 时，`Host::LoadScripts()` 才回落到这两个内置函数；正常开发/分发（build-nw.bat 会 xcopy JS 到 bin\\api\\）走的是磁盘版。\n"},{"p":"src/nw_script_stub.cpp.md","g":"native (C++/JS core)","t":"nw_script_stub.cpp —— 内置脚本缺失时的空占位","m":"# nw_script_stub.cpp —— 内置脚本缺失时的空占位\n\n- 源文件：[nw_script_stub.cpp](../../src/nw_script_stub.cpp)（全文件仅十余行）\n- 角色：[nw_script.h](nw_script.h.md) 两个访问函数的**空实现**：`BuiltinApiScript()` 与 `BuiltinNodeScript()` 都返回空串。\n\n## 什么时候编它\n\n- 它是 [embed-js.ps1](../build/embed-js.ps1.md) 生成失败时的回退：[build-nw.bat](../build/build-nw.bat.md) 先尝试生成 [nw_script_generated.cpp](nw_script_generated.cpp.md)，失败（errorlevel 1）才把本文件放进编译列表（构建脚本里的 `SCRIPT_SRC` 切换）；\n- 生成成功时本文件**不参与编译**（两个函数定义只在 generated 文件里），不会冲突。\n\n## 后果\n\n空内置副本意味着：exe 旁边必须存在 `api\\*.js`（以及未禁 node 时的 `nw_node.js`），否则 `Host::LoadScripts()` 会以\"缺少 api\\\\*.js\"启动失败。\n"},{"p":"api/00_base.js.md","g":"page JS (js/api)","t":"00_base.js —— 页面侧地基：通道、Emitter、工具","m":"# 00_base.js —— 页面侧地基：通道、Emitter、工具\n\n- 源文件：[js/api/00_base.js](../../js/api/00_base.js)\n- 加载顺序：api 模块第一个（数字前缀即顺序）。所有模块共享同一个外层 IIFE 函数作用域，本文件定义的东西直接被后续模块使用。\n\n## 干了什么事\n\n### 1. 通道变量与状态\n- `queryChannel()`：用的时候再取 `window.mbQuery`（内核异步注入，顶部捕快照可能是 undefined）；\n- `syncBase`：探测成功的通道标记（`http-loopback` / `prompt` / 具体 XHR 基址），null=不可用；\n- `useLoopbackChannel/usePromptChannel`：sendSync 的分发开关。\n\n### 2. 载荷编码（与 native 三路统一）\n`utf8Binary`（TextEncoder 或 unescape(encodeURIComponent)）→ `encodePayload = encodeURIComponent(btoa(utf8))`。中文先转 UTF-8 字节再 base64，避免拼进 URL 时被百分号编码膨胀三倍。\n\n### 3. 三条同步通道实现\n- **`loopbackEndpoint()`**：读预注入的 `__nmbRpcPort/__nmbRpcToken` 与 `__nwWindowId`，拼 `http://127.0.0.1:\u003cport\u003e/w\u003cid\u003e/?t=\u003ctoken\u003e`；\n- **`loopbackOnce(request)`（主通道）**：`new XMLHttpRequest(); open(\u0027POST\u0027, url, false)` 同步发送；`Content-Type: text/plain;charset=UTF-8`——刻意保持 CORS 简单请求（同步 XHR 不允许触发 OPTIONS 预检），令牌放 URL 而不放自定义头也是为此。连接级失败（send 抛异常）换新连接重试 1 次；HTTP 4xx/5xx 不重试（协议问题重试不变）；\n- **`promptOnce(request)`（退路）**：`window.prompt(\"__nmb_rpc__:\" + payload)`，最多 3 次；应答前后可能带 NUL/脏字符，截取第一个 `{` 到最后一个 `}` 再 JSON.parse 验真，失败再试；\n- **`xhrOnce(base, request)`（老内核退路）**：同步 GET 到 `./__nmb_rpc__/`、`http://nmb-rpc/rpc/`、`nmb-rpc://rpc/` 三个候选；自定义 scheme 没有真实状态码，0 也算成功；\n- `sendSync(base, request)` 按两个开关分发。\n\n### 4. 通道探测：`probeSyncChannel()`\n顺序：① loopback（用一条真实 `app.info` 探测，成功连结果一起返回，省一次往返）→ ② prompt（`__nmbPromptAvailable` 时两轮，每轮自带重试）→ ③ 三个 XHR 候选。失败原因累加进 `window.__nmbSyncProbeError`，成功通道名写 `window.__nmbSyncChannel`。\n\n### 5. 对外的四个通道函数（后续模块只用它们）\n- `rpc(command, payload)`：同步取数。首次调用懒探测（mb108 在脚本上下文创建回调内禁止同步 XHR，所以不能在加载时探测）；失败抛错；应答 JSON.parse 校验，`s===\u0027err\u0027` 抛 Error；挂在 `window.__nmbRpc`；\n- `rpcSafe(command, payload, fallback)`：同上，失败把 `cmd: message` 记进 `window.__nmbRpcErrors` 并返回兜底值；\n- `rpcAsync(command, payload, done)`：走 mbQuery 异步应答，done(error, value)；挂 `__nmbRpcAsync`；\n- `tell(command, payload)`：只求做到的异步调用，失败记 `window.__nmbAsyncErrors` 并 console.warn；挂 `__nmbTell`。\n\n### 6. Emitter 与工具\n极简事件发射器 `Emitter`：on/once/removeListener/removeAllListeners/emit（emit 内对单个处理器 try/catch，不让一个坏处理器炸掉整轮）；`exposeStatics(ctor, skip)` 把原型方法复制为静态方法（nw 的 Clipboard/Shell 静态/实例同名用法靠它）。\n\n## 自检钩子（供 tests/apps/smoke 使用）\n`__nmbSyncChannel`、`__nmbSyncProbeError`、`__nmbRpcErrors`、`__nmbAsyncErrors`，以及 10 号文件挂的 `__nmbChannel`（含线程拓扑）。\n"},{"p":"api/10_api_nw_app.js.md","g":"page JS (js/api)","t":"10_api_nw_app.js —— nw.App","m":"# 10_api_nw_app.js —— nw.App\n\n- 源文件：[js/api/10_api_nw_app.js](../../js/api/10_api_nw_app.js)\n- 对应 SDK：`src/resources/api_nw_app.js`（browser 侧 app.js）。\n\n## 干了什么事\n\n### 启动数据\n优先用 native 预注入的 `window.__nmbBootAppReply`；没有就调 `probeSyncChannel()`（其 app.info 探测结果直接复用）。同步通道完全不可用时置 `syncUnavailable`，给空清单占位，并用 `rpcAsync(\u0027app.info\u0027)` 异步补齐 fullArgv/dataPath/manifest。\n\n### 诊断出口\n`window.__nmbChannel`：带 `threads`（native 实测线程拓扑）、`syncSharesUi`，并用 getter 暴露当前 `syncBase` 与 `__nmbSyncProbeError`；`window.__nmbAppInfo` 保留原始 app.info（含不出现在公开 API 里但自检需要的路径字段）。\n\n### App 对象（继承 Emitter）\n- `fullArgv`：native 原样命令行；\n- `filteredArgv`：四条\"宿主开关\"正则（`--url=`、`--remote-debugging-port=`、`--renderer-cmd-prefix=`、`--nwapp=`），可读可写；\n- `argv`：**只读 getter**，返回 fullArgv 过滤掉 filteredArgv 命中项的结果（语义照抄 SDK；strict 模式下给无 setter 的访问器赋值会抛 TypeError）；\n- `dataPath`、`manifest`、`filter`（Emitter）；\n- 生命周期（全走异步 `tell`）：`quit/exit(code)/restart`；\n- `clearCache`：空转（缓存归内核管，无对外开关）；\n- 崩溃测试口：`crashBrowser/crashRenderer` → `app.crash`（browser/renderer 同进程，即整个进程硬退）；`setCrashDumpDir` 空转（无 crashpad）；\n- 代理/源白名单：内核未暴露网络栈配置，`setProxyConfig/addOriginAccessWhitelistEntry/removeOriginAccessWhitelistEntry` 如实空转，`getProxyForURL` 同步回 `\u0027DIRECT\u0027`——不假装成功；\n- **全局热键**：`registerGlobalHotKey(shortcut)/unregisterGlobalHotKey(shortcut)` 只是转发到 53 号模块的 `shortcutRegistry`（与 SDK 一致，nw.App 只是转发层）。App 入口用 1..999 的 id 段，与 Shortcut 原型用的 1000+ 段错开，避免互相误删；注册失败调 `shortcut.failed`。\n"},{"p":"api/15_api_nw_internal.js.md","g":"page JS (js/api)","t":"15_api_nw_internal.js —— native 绑定分界层","m":"# 15_api_nw_internal.js —— native 绑定分界层\n\n- 源文件：[js/api/15_api_nw_internal.js](../../js/api/15_api_nw_internal.js)\n- 对应 SDK：`src/resources/api_window_internal.js`（bindingUtil 一句话一个 native 请求那层）。\n\n## 这个文件存在的意义\n\nSDK 里这层只管\"发请求\"，对象语义全留给上层模块。本实现沿用同一条分界线，但底下换成 [00_base.js](00_base.js.md) 的通道：上层模块（主要是 [20_api_nw_window.js](20_api_nw_window.js.md)）只表达\"我要读\"还是\"我要改\"，**不直接调 rpc/tell**。\n\n## 三个口子\n\n- `internalRead(command, id, payload)`：要结果、失败就抛。自动补 `id`；交给 `rpc()`；\n- `internalReadSafe(command, id, payload, fallback)`：要结果、拿不到用兜底值，原因经 `rpcSafe` 记进 `window.__nmbRpcErrors`；\n- `internalTell(command, id, payload)`：只求做到，失败经 `tell` 记 `__nmbAsyncErrors` 并 warn。\n\n## 同步白名单的\"页面侧镜像\"\n\n`syncPrefixes = [\u0027app.info\u0027,\u0027fs.\u0027,\u0027process.\u0027,\u0027clipboard.\u0027,\u0027screen.\u0027,\u0027shell.\u0027,\u0027win.state\u0027]`，暴露成 `window.__nmbSyncPrefixes`。\n\n注意它**不是开关**：某条命令到底能不能同步，权威永远是 native（[nw_host.cpp](../../src/nw_host.cpp) 的 `SyncSafeCommand` 两道闸门）。这份清单只用于**对账**：若某命令不在镜像里却同步走通（或反之），`internalRead` 会把它记进 `window.__nmbSyncSurprises`，让 smoke 自检能发现两边漂移。\n"},{"p":"api/20_api_nw_window.js.md","g":"page JS (js/api)","t":"20_api_nw_window.js —— nw.Window 与 WindowState","m":"# 20_api_nw_window.js —— nw.Window 与 WindowState\n\n- 源文件：[js/api/20_api_nw_window.js](../../js/api/20_api_nw_window.js)（页面层最大模块，约 21KB）\n- 对应 SDK：`api_nw_window.js` + `api_nw_newwin.js`。\n\n## 核心数据结构\n\n- `windowById`：id → WindowState；`currentId = window.__nwWindowId`（preamble 预注入）；\n- `WindowState(id)`：一个 nw 窗口的 JS 镜像。**id 允许为 null**——`Window.open` 的真实 id 是异步回来的，先交对象、命令排队，`__resolve(id)` 结算后补发（见下）。\n\n## 两个必须理解的访问器\n\n`title` 与 `zoomLevel` 在 SDK 里是访问器（读走 currentWindowInternal，写走 setXxxInternal），不是普通字段：\n- 内部值存 `__title/__zoom`，构造期只能写内部字段（写 this.title 会在还没 pending 队列时就发命令）；\n- setter = 设**覆盖值**：发 `win.setTitle/win.setZoom`；此后 document.title 不再改标题栏，直到导航到新文档（native 的 title_override）。\n- native 推回来的状态只能写 `__title/__zoom`，直接赋 this.title 会造成\"回声\"（状态又被当本地改动送回去）。\n\n## 状态合并：`sync(state)`\n\n把 native `win.state`/事件推送合并进对象并转成 nw 事件：x/y/width/height 直接填（不发 move/resize，编程调用自己已发过）；maximized/minimized/fullscreen 变化发对应/leave- 事件；title/url 变化发事件；zoom 只更新不发事件（nw 无 zoom 事件）。\n\n## 命令三个口子 + id 排队\n\n- `read/readSafe` → [internalRead/ReadSafe](15_api_nw_internal.js.md)（目前唯一能同步读的窗口命令是 win.state；canGoBack/canGoForward 走 Safe，拿不到老实回 false 并留错，不编值）；\n- `act` → internalTell；**id===null 时命令进 `__pending` 队列**，`__resolve(id)` 时按序补发；\n- `close()` 例外不排队（窗口还没结算就关，语义是\"别开了\"）；`close(false)` 先问 `close` 事件处理器可否决。\n\n## 实现的窗口方法（均映射到 win.* 命令）\n\n- 显隐/焦点/状态：show/hide/focus/blur/close/destroy/maximize/unmaximize/minimize/restore；\n- 全屏/kiosk：enterFullscreen/leaveFullscreen/toggleFullscreen、enterKioskMode/leaveKioskMode/toggleKioskMode；\n- 几何：moveTo/resizeTo/moveBy/resizeBy（负数抛错）、setMinimumSize/setMaximumSize、setPosition(\u0027center\u0027|\u0027mouse\u0027)；\n- 样式/行为：setResizable、setAlwaysOnTop、setShowInTaskbar、setVisibleOnAllWorkspaces（Windows=TOPMOST；canSet 恒真）、setIgnoreMouseEvents、setTransparent、requestAttention（FlashWindow）、setBadgeLabel（Mac only，Windows no-op）；\n- 导航/视图：setTitle、setZoom/zoomLevel、reload/reloadIgnoringCache、back/forward、load/navigate、canGoBack/canGoForward（同步读历史栈，红线命令拿不到就 false）、showDevTools/closeDevTools；\n- `eval(code)`：同步取最后表达式值——它在 native Blink 重入红名单上，会被明确拒绝，注释提示应用改用事件/回调；\n- 菜单：setMenu(menu)，id 未结算时把 menu.set 也排队；\n- 任务栏：setProgressBar（\u003c0 移除 / \u003e1 跑马灯 / 0..1 百分比）；\n- `capturePage(cb, type)`：走异步 win.capturePage，native 回 RGBA 裸像素 base64，页面 canvas 组 dataURL；无 callback 时返回 Promise；\n- `getPrinters(cb)`：native 回名字数组，页面补成 `{name}` 对象；`print()` 转发（内核无打印栈，会 Fail）；\n- `stop()` 调本页面 window.stop；`syncNow()` 拉一次 win.state 合并；`get()` 返回自身。\n\n## 静态 API\n\n- `Window.get(id)`：命中表就返回；否则新建 WindowState 并立刻用 readSafe(\u0027win.state\u0027) 尽量填充（被拒也能得到\"只知道 id\"的对象）；\n- `Window.open(url, options)`：先 new WindowState(null)，异步 `win.create`（config 序列化携带 url），成功后 `__resolve(value.id)` → 补 state → emit(\u0027loaded\u0027)；失败 emit(\u0027error\u0027)。**同步返回句柄、id 异步结算**就是靠 pending 队列；\n- `getAll()`：win.list 没进同步白名单，拿不到就退化为只给当前窗口；`getCurrent()`。\n"},{"p":"api/40_api_nw_menuitem.js.md","g":"page JS (js/api)","t":"40_api_nw_menuitem.js —— nw.MenuItem","m":"# 40_api_nw_menuitem.js —— nw.MenuItem\n\n- 源文件：[js/api/40_api_nw_menuitem.js](../../js/api/40_api_nw_menuitem.js)\n- 对应 SDK：`api_nw_menuitem.js`。\n\n## 干了什么事\n\n### 菜单项对象\n`MenuItem(options)`：字段 label/tooltip/icon/checked/enabled/type（normal|checkbox|separator|normal）/key/modifiers/submenu/click。\n- checkbox 点击时由 41 号模块在派发 click 前翻转 checked；\n- separator 没有 label/key/click；\n- submenu 接受 Menu 实例；\n- `click` 是直接回调；菜单弹出的命令路径在下面。\n\n### 点击注册表（核心）\n- 全局 `menuClickRegistry`（id → MenuItem）+ `menuClickSeq = 1001`（id 从 1001 起，避开 Win32 常用低 id 与热键段）；\n- `registerMenuItemClick(item)` 给每个可点项分配一个**页面侧数字 id**；\n- `serializeMenu(items)`：递归把 Menu 的 items 数组转成可过 JSON 线的结构——每项 `{id, label, type, checked, enabled, key, modifiers, submenu:[...]}`。这个结构就是 native `BuildMenuItems` 建 HMENU 时用的契约；\n- 派发口 `window.__nmbMenuClick(id)`：native TrackPopupMenu/WM_COMMAND 回来的数字 id 经 EvalInWindow 调这里 → 查 registry → 翻转 checkbox → 触发 item.click 与其 menu 的 itemclick 事件。\n- 构造时即登记，移除菜单由 41 号模块处理。\n"},{"p":"api/41_api_nw_menu.js.md","g":"page JS (js/api)","t":"41_api_nw_menu.js —— nw.Menu","m":"# 41_api_nw_menu.js —— nw.Menu\n\n- 源文件：[js/api/41_api_nw_menu.js](../../js/api/41_api_nw_menu.js)\n- 对应 SDK：`api_nw_menu.js`。\n\n## 干了什么事\n\n`Menu(type)`（`\u0027menubar\u0027 | \u0027contextmenu\u0027`），继承 Emitter（事件 itemclick），内部 `items` 数组装 [MenuItem](40_api_nw_menuitem.js.md)。\n\n- 结构操作（纯本地，同步）：`append(menuItem)/insert(index, item)/remove(item)/removeAt(index)`，并实现 items 的只读 getter；\n- `attach(win)` / `win.setMenu(menu)`：异步 `menu.set`，把整个菜单（`serializeMenu` 递归序列化 + 窗口 id）发给 native 建/换 HMENU；菜单栏挂在框架窗口；\n- `popup(x, y)`：异步 `menu.popup`，native TrackPopupMenu 弹出右键菜单；点击经 `window.__nmbMenuClick(id)`（定义在 40 号文件）回流；\n- `createMacBuiltin/removeItem/items` 等 Mac-only 入口保持 API 形状但空转/有限实现（本宿主是 Windows）。\n\n## 与 native 的契约线\n\n命令：`menu.set/create`（建菜单）、`menu.popup`（弹菜单）、`menu.clear`（清除窗口菜单栏）、`menu.setLabel`（动态改项文字，更新本地镜像）。实现见 [nw_host.cpp](../../src/nw_host.cpp) 的 `BuildMenuItems/ApiMenu`。\n"},{"p":"api/50_api_nw_clipboard.js.md","g":"page JS (js/api)","t":"50_api_nw_clipboard.js —— nw.Clipboard","m":"# 50_api_nw_clipboard.js —— nw.Clipboard\n\n- 源文件：[js/api/50_api_nw_clipboard.js](../../js/api/50_api_nw_clipboard.js)\n- 对应 SDK：`api_nw_clipboard.js`。\n\n## 两种用法（SDK 语义）\n\n- **实例**：`new Clipboard()` → 具名剪贴板选择器（本实现里只有系统剪贴板），实例方法 `.get(type)/.set(data, type)/.readList/writeList/clear`；\n- **静态**：`Clipboard.get()` 返回全局单例（`exposeStatics` 把原型方法复制成静态方法时，静态 get 被显式覆盖为\"返回单例\"，否则静态 get() 会变成\"取一个新选择器\"，语义就错了）。\n\n## 干了什么事\n\n- `set(data, type)` / `get(type)`：type 支持 `text`（或 raw → `CF_UNICODETEXT`）、`html`（`CF_HTML`，其特殊头部由 native 回填/剥离）、`png`、`rtf`；\n- png/rtf 在页面与 native 之间用 **base64** 承载二进制；text/html 直接字符串；\n- `readAvailableTypes()` 读当前剪贴板里有哪些格式（`clipboard.availableTypes`，同步白名单）；\n- `clear()`：`clipboard.clear`；\n- 所有读写都走同步 `rpc/rpcSafe`（clipboard.* 在任意线程白名单），native 侧 OpenClipboard 带重试，见 [nw_host.cpp](../../src/nw_host.cpp) 的 `ApiClipboard`。\n"},{"p":"api/51_api_nw_shell.js.md","g":"page JS (js/api)","t":"51_api_nw_shell.js —— nw.Shell","m":"# 51_api_nw_shell.js —— nw.Shell\n\n- 源文件：[js/api/51_api_nw_shell.js](../../js/api/51_api_nw_shell.js)\n- 对应 SDK：`api_nw_shell.js`。\n\n## 干了什么事\n\n薄封装层，四个静态方法（经 `exposeStatics` 同时提供实例同名方法），全部异步 `tell`，native 同步白名单里的 `shell.*`：\n\n- `openExternal(uri)`：默认程序打开 URL；\n- `openItem(path)`：系统关联程序打开文件；\n- `showItemInFolder(path)`：资源管理器定位并选中；\n- `beep()`：系统提示音。\n\nnative 实现在 [nw_host.cpp](../../src/nw_host.cpp) 的 `ApiShell`（ShellExecuteW / MessageBeep）。\n"},{"p":"api/52_api_nw_screen.js.md","g":"page JS (js/api)","t":"52_api_nw_screen.js —— nw.Screen","m":"# 52_api_nw_screen.js —— nw.Screen\n\n- 源文件：[js/api/52_api_nw_screen.js](../../js/api/52_api_nw_screen.js)\n- 对应 SDK：`api_nw_screen.js`。\n\n## 干了什么事\n\n- `Screen.Init()`：同步 `rpc(\u0027screen.screens\u0027)`（白名单），缓存到 `screens` 属性：数组，每项 `{id, bounds:{x,y,width,height}, scaleFactor, isPrimary, work_area, ...}`，数据来自 native EnumDisplayMonitors（[nw_host.cpp](../../src/nw_host.cpp) 的 `EnumScreenProc/ApiScreen`）；\n- 显示器变化：native 收到 WM_DISPLAYCHANGE 经 `window.__nmbScreenEvent` 回页面，重新 Init 后 emit `displayBoundsChanged`；\n- **有意不发** `displayAdded/displayRemoved`：没有可靠的\"哪块屏被加/拔\"消息源，WM_DISPLAYCHANGE 只告诉\"有变化\"，注释明确拒绝猜，只做整体刷新。\n- `Screen.screens` 缓存属性、`Screen.Init` 静态入口；事件走 Emitter。\n"},{"p":"api/53_api_nw_shortcut.js.md","g":"page JS (js/api)","t":"53_api_nw_shortcut.js —— nw.Shortcut（全局热键）","m":"# 53_api_nw_shortcut.js —— nw.Shortcut（全局热键）\n\n- 源文件：[js/api/53_api_nw_shortcut.js](../../js/api/53_api_nw_shortcut.js)\n- 对应 SDK：`api_nw_shortcut.js`。\n\n## 干了什么事\n\n- `Shortcut(option)`：option `{key, active, failed}`。`key` 形如 `\"Ctrl+Shift+P\"`；active 是热键按下回调，failed 是注册失败回调。继承 Emitter（active/failed）；\n- **id 段规则**：原型注册用的数字 id = `(keys 数量 + 1) * 1000` 起，保证\"相同组合键的多个 Shortcut 实例\"落在同一区间，native 侧同一组合只保留最后一次注册（SDK 语义）；[10 号 App](10_api_nw_app.js.md) 的转发入口则用 1..999 段，互不干扰；\n- `shortcutRegistry`：全局表，key → 最新 Shortcut；\n- `register()/unregister()`：异步 `shortcut.register/unregister`（payload 带组合键与回调名），native RegisterHotKey；`Shortcut.registerGlobalHotKey/unregisterGlobalHotKey` 是同名转发（App 层再转发到这里）；\n- 派发口 `window.__nmbHotkey(key)`：WM_HOTKEY 经 EvalInWindow 调这里 → 查 registry → emit active；\n- native 注册失败时页面通过异步回执 emit failed。实现见 [nw_host.cpp](../../src/nw_host.cpp) 的 `ApiShortcut`。\n"},{"p":"api/54_api_nw_tray.js.md","g":"page JS (js/api)","t":"54_api_nw_tray.js —— nw.Tray（系统托盘）","m":"# 54_api_nw_tray.js —— nw.Tray（系统托盘）\n\n- 源文件：[js/api/54_api_nw_tray.js](../../js/api/54_api_nw_tray.js)\n- 对应 SDK：`api_nw_tray.js`。\n\n## 干了什么事\n\n- `Tray(option)`：`{title, tooltip, icon, menu, iconsAreTemplates}`，继承 Emitter（click）。托盘是**进程级资源**（窗口全关托盘也活着），注册表 `trayRegistry` 在 [90_install.js](90_install.js.md) 全局装配。\n- **异步创建 + id 排队**：与 Window.open 同理——`new Tray()` 先有对象，`__create` 异步发 `tray.create`（带 tooltip/图标），native 回 id 后 `__resolve(id)`；在此之前调用 setTooltip/setIcon 会排队（`__iconQueued`），结算后补发；\n- `setTooltip(text)` / `setIcon(path)`：异步 `tray.setTooltip/setIcon`（图标路径解析在 native）；\n- `remove()`：异步 `tray.remove`，native Shell_NotifyIcon(NIM_DELETE) 并 DestroyIcon；\n- 派发口 `window.__nmbTrayEvent(id, event)`：native 托盘消息（左键单击等）经 EvalInWindow 调这里 → 查 registry → emit click；\n- **右键弹菜单**：收到右键事件时若该托盘带 menu，页面调 `menu.popup` 或专门的托盘弹菜单路径，由 native TrackPopupMenu（挂在拥有托盘的窗口线程）；\n- title/iconsAreTemplates 为 Mac 字段，Windows 上保持形状不生效。\n\nnative 侧见 [nw_host.cpp](../../src/nw_host.cpp) 的 `ApiTray` 与 `g_trays` 全局表。\n"},{"p":"api/90_install.js.md","g":"page JS (js/api)","t":"90_install.js —— 装配层：挂 window.nw、接管事件与新窗口","m":"# 90_install.js —— 装配层：挂 window.nw、接管事件与新窗口\n\n- 源文件：[js/api/90_install.js](../../js/api/90_install.js)（api 模块最后一个）\n- 对应 SDK：`api_nw.js` / `api_nw_nw.js` 的装配部分。\n\n## 干了什么事（按序）\n\n1. **取当前窗口镜像**：`Window.get(currentId)`，后续所有窗口级事件都挂它；\n2. **window.nw 命名空间**：`window.nw = {}`（Object，没有自有方法；nw 对象本身只是命名空间占位）；挂上 App/Window/Menu/MenuItem/Clipboard/Shell/Screen/Shortcut/Tray；node 脚本随后回填 `nw.require`；\n3. **native 事件总入口 `window.__nmbEvent`**：native EvalInWindow 推来的事件（窗口 maximize/minimize/restore/focus/blur/move/resize/enter-fullscreen/title/zoom 等）统一进这里 → 找 WindowState → `sync()` 合并/emit；\n4. **新窗口 `window.__nmbOpenWindow(payload)`**：native 的 `mbOnCreateView` 回调（页面 target=_blank/window.open）经这里 → 用 `Window.open(url, options)` 建 JS 侧对象；\n5. **关闭否决 `window.__nmbCloseVerdict`**：框架窗口收到 WM_CLOSE 时 native 同步问一句，这里看当前 WindowState 是否有 `close` 事件处理器（`close(false)` 语义）决定是否允许关闭；\n6. **接管 window.open**：保存原始引用后，把页面 `window.open` 替换为走 nw 开窗流程（由 host 窗口承载，而非内核弹窗）；\n7. 模块注册表（trayRegistry/shortcutRegistry/menuClickRegistry 由 40/53/54 定义、这里统一通过 `window.nw` 暴露）；\n8. 幂等守卫：外层 IIFE 的 `__nmbInstalled`（所有 api 模块共享）保证重复注入不重复挂。\n\n## 为什么它必须最后\n\n所有 `window.__nmb*` 回调入口依赖前面模块定义好的构造器与注册表；native 回调可能在脚本注入后任意时刻到达，必须在本文件执行完那一刻全部就绪。\n"},{"p":"build/build-nw.bat.md","g":"build \u0026 tools","t":"build-nw.bat —— 构建 nw.exe","m":"# build-nw.bat —— 构建 nw.exe\n\n- 源文件：[build-nw.bat](../../build-nw.bat)\n- 角色：一条命令把 `src\\` 下 5 个 C++ 源文件 + `generated\\` 内置脚本编成 `bin\\nw.exe`，并把页面 JS 与内核 dll 摆到它旁边。\n\n## 干了什么事（按序）\n\n1. **找 zig**：本机 MSVC CRT 损坏、cl 链接必挂（文件头注释），所以用 zig 自带的 mingw 交叉工具链。\n   候选目录 `..\\.toolchain-fresh` → `..\\.toolchain-fixed` → `..\\.toolchain` 下的\n   `zig-x86_64-windows-0.15.2\\zig.exe`；都没有再 `where zig` 找 PATH。\n2. **生成内置脚本**：调 [embed-js.ps1](embed-js.ps1.md)（入参 `js\\api` / `js\\nw_node.js` / `generated\\nw_script_generated.cpp`）生成 [nw_script_generated.cpp](../src/nw_script_generated.cpp.md)；\n   `errorlevel 1` 时回退 `SCRIPT_SRC=src\\nw_script_stub.cpp`（空副本，此时 exe 旁必须有 JS）。\n3. **编译**：\n   `zig c++ -target x86_64-windows-gnu -std=c++17 -O2 -Isrc`\n   `-DWIN32_LEAN_AND_MEAN -DNOMINMAX -DUNICODE -D_UNICODE`\n   源文件：`src\\nw_main src\\nw_host src\\nw_kernel src\\nw_package src\\nw_rpc` + 脚本副本（`-Isrc` 让 generated 的 cpp 能找到 `nw_script.h`）；\n   链接库：`user32 gdi32 shell32 ole32 oleaut32 advapi32 kernel32 winspool ws2_32 m`\n   （winspool=打印枚举、ws2_32=loopback RPC、shell32=托盘/ShellExecute 等）；\n   产物 `bin\\nw.exe`。\n4. **摆 JS**：`xcopy js\\api\\*.js bin\\api\\`；拷 `js\\nw_node.js` 到 `bin\\`；\n   主动删遗留的 `bin\\nw_api.js`（拆分前的单体版，宿主已不读，留着是第二份错误事实源）。\n5. **摆内核**：当前分发目标固定 mb108（注释明确\"不要在后续构建里悄悄换回 mb132\"）。\n   bin 里没有时依次从 `F:\\downloads\\mb108_241102\\bin\\win_x64\\` 与 `..\\bin\\` 拷 `mb108_x64.dll`；\n   仍没有只警告（可用 `--nw-kernel=\u003c路径\u003e` 启动）。\n\n## 工程注意\n\n- **全文件必须 ASCII**：cmd 按 OEM 码页（本机 936/GBK）逐字节读 .bat，UTF-8 中文会吞掉后续字符导致\n  \"The syntax of the command is incorrect\"（文件头注释）。中文请写在 .md/.html 里。\n- 在本机跑（PowerShell）需要给 zig 指定可写缓存，否则沙箱/中文路径可能报错：\n  `$env:ZIG_GLOBAL_CACHE_DIR=\"f:\\编程\\MBPython-master\\NativeMediaBridge\\.zig-global-cache\"`，\n  并把 `TEMP/TMP` 指到同盘可写目录；然后在 `nw\\` 下执行 `.\\build-nw.bat`。\n"},{"p":"build/embed-js.ps1.md","g":"build \u0026 tools","t":"embed-js.ps1 —— 把页面 JS 烤进 C++ 内置副本","m":"# embed-js.ps1 —— 把页面 JS 烤进 C++ 内置副本\n\n- 源文件：[tools/embed-js.ps1](../../tools/embed-js.ps1)\n- 角色：构建期由 [build-nw.bat](build-nw.bat.md) 调用，读 `js\\api\\*.js` 与 `js\\nw_node.js`，\n  生成 [nw_script_generated.cpp](../src/nw_script_generated.cpp.md)（磁盘路径 `generated\\`）。\n\n## 干了什么事\n\n1. 入参：`-ApiDir`（页面 api 目录，构建时传 `js\\api`）、`-NodeJs`（nw_node.js 路径，构建时传 `js\\nw_node.js`）、`-Output`（生成的 .cpp，构建时传 `generated\\nw_script_generated.cpp`）；\n2. `Read-Utf8`：按字节读文件，**剥除 UTF-8 BOM**（否则注入脚本开头多三个杂散字节）；\n3. **必须切片**：MSVC 单个字符串字面量超过 **16380 字节会被静默截断（C2026）**——\n   截断的脚本表现为\"注入了半个文件、语法错、还没人立刻发现\"。这里按 **8000 字符**切片，\n   每片一个 C++ 原始字面量 `R\"NWJS(...)NWJS\",`，运行时在生成的函数里把各片 `+=` 拼回整串；\n   若脚本原文含字面量终止串 `)NWJS\"`，直接报错让你换分隔符；\n4. **api 装配与运行时逐字节一致**：`Get-ApiText` 按文件名排序枚举 `*.js`，\n   先写 prologue（`(function(){ \u0027use strict\u0027; if(window.__nmbInstalled)return; window.__nmbInstalled=true;`），\n   每个模块前加 `// ---- 文件名 ----`，最后 epilogue `})();`。\n   注释明确：这套包装必须与 [nw_host.cpp](../../src/nw_host.cpp) 的 `AssembleApiModules()`\n   （kApiPrologue/kApiEpilogue）保持一致，否则\"烤进 exe 的\"和\"exe 旁边磁盘读的\"两条路径行为分叉；\n5. 输出两个函数 `BuiltinApiScript()`、`BuiltinNodeScript()`（nw_node.js 不存在时为空串），\n   用 UTF-8 无 BOM 写盘，CRLF 行尾。\n\n## 工程注意\n\n- **全文件 ASCII only**：PowerShell 5.1 在中文系统上把无 BOM 的 .ps1 当 GBK 读，\n  非 ASCII 会被错码到解析失败（\"Missing \u0027)\u0027 in method call\"，文件头注释）。\n"},{"p":"build/split_api.py.md","g":"build \u0026 tools","t":"split_api.py —— 一次性重构脚本：单体 nw_api.js 拆成 js\\api\\ 多模块","m":"# split_api.py —— 一次性重构脚本：单体 nw_api.js 拆成 js\\api\\ 多模块\n\n- 源文件：[archive/split_api.py](../../archive/split_api.py)\n- 角色：**历史工具，已执行完毕，正常构建不调用它。** 把旧的单文件页面脚本\n  [nw_api.js](../src/nw_api.js.md) 按 nw.js SDK 的模块边界拆成了 [js/api/](../../js/api/) 下的多模块。\n\n## 它做了什么（文档价值）\n\n- 只做\"按行范围搬家 + 给每个新文件加文件头注释\"，**不改变任何语句**；语义改动（title/zoomLevel\n  访问器、internal 绑定层等）在搬家之后单独做；\n- 文件里写死了每个目标模块对应的**原文行号区间**（`sl(a, b)`，1 起含两端），\n  并带\"反向拼回与原文逐行比对\"的双向自检，证明搬迁没丢语句；\n- 每个新文件头写清它对应 SDK 的哪个 `api_nw_*.js`。\n\n## 拆完后的前提（至今仍约束 js/api/ 目录）\n\n宿主把 `js\\api\\*.js` **按文件名排序拼成一个脚本**，外面统一包一层 IIFE（`window.__nmbInstalled`\n幂等守卫）。因此：\n\n- 各模块共享同一个函数作用域——单模块内不要再套自己的 IIFE，也别重复 `\u0027use strict\u0027`；\n- 文件名数字前缀（00/10/15/20/…/90）就是加载顺序。\n\n## 现状\n\n跑完即可删除的一次性工具，但保留它可以让后来者追溯\"某个函数最初在旧单体文件的哪一段、\n为什么落在现在这个模块\"。想继续拆/并模块时可参考其写法。\n"},{"p":"tests/00-测试总览.md","g":"tests","t":"tests/ —— 端到端测试体系总览","m":"# tests/ —— 端到端测试体系总览\n\n- 目录：[tests/](../../tests/)\n- 原则（读每个测试前先记住）：这些测试都在**真实的 bin\\nw.exe 进程**里跑，不 mock 内核。\n  很多证据页面自己拿不到（标题栏文字、窗口父子关系），所以刻意从**进程外部**取证。\n\n## 三套测试应用 + 六个驱动脚本\n\n| 被测应用 | 驱动脚本 | 外部探针 | 验证什么 |\n|---|---|---|---|\n| [smoke/](app-smoke.md)（21 项断言） | [run-smoke.bat](run-smoke.bat.md) | 落盘 JSON 报告 | 整条桥：nw.* 注入、node 桥、fs 落盘、Screen/Window/Clipboard、同步通道、Window.open 异步结算、mbQuery 异步应答 |\n| [title/](app-title.md)（标题链路） | [run-title.bat](run-title.bat.md) | `tasklist /v` 每秒采样窗口标题 + stderr 页面日志 | setTitle 覆盖值生效、document.title 不能反超、导航后覆盖值清除 |\n| [fsapp/](app-fsapp.md)（fs 改文件） | [run-fsapp.bat](run-fsapp.bat.md)（手工）/ [run-fsapp-auto.bat](run-fsapp-auto.bat.md)（自动） | 直接看 test-file.txt 与窗口标题 | 主脚本栈同步 fs + 点击触发的 appendFile 真的改了磁盘文件 |\n| （复用 title 应用开窗） | [run-window.bat](run-window.bat.md) + [window_probe.ps1](window_probe.ps1.md) | Win32 P/Invoke 查子窗口 | miniblink 控件窗口是框架窗口的真实子窗口、位置正确（mb108 窗口 ABI 回归） |\n\n## 统一约定\n\n- 所有 .bat / .ps1 **纯 ASCII**：cmd 按 OEM 码页（936）读 .bat、PS 5.1 按 GBK 读无 BOM .ps1，\n  非 ASCII 会直接破坏解析。中文只出现在 .html / .md 里。\n- 驱动脚本都 `cd /d \"%~dp0..\"` 回到 `nw\\`，用相对路径 `bin\\nw.exe --nwapp=tests\\xxx`；\n  bin\\nw.exe 不在则退出码 1（先跑 [build-nw.bat](../build/build-nw.bat.md)）。\n- 自动化防挂死：启动一律带 `--nw-no-dialog`（或应用自退），启动失败不弹模态框；\n  超时/收尾都 `taskkill /im nw.exe /f`。\n- 退出码约定（各 runner）：`0`=PASS，`1`=环境缺失（没编译），`2`=超时/无窗口，`3/4`=断言失败。\n\n## 已验证状态（背景）\n\nloopback 主通道落地后，smoke 连跑 25 轮、title 5 轮、window 5 轮全绿；\n安全项实测：错令牌 403、仅 127.0.0.1 监听。这些测试的价值就是把\"通道偶发失败\"这类\n随机问题变成可重复复跑的回归。\n"},{"p":"tests/app-fsapp.md","g":"tests","t":"tests/apps/fsapp —— fs 修改磁盘文件可用性应用","m":"# tests/apps/fsapp —— fs 修改磁盘文件可用性应用\n\n- 页面：[tests/apps/fsapp/index.html](../../tests/apps/fsapp/index.html)；清单：[package.json](../../tests/apps/fsapp/package.json)\n  （name `fsapp`，`nodejs:true`，760x600，title \"nw SDK fs test\"）\n- 驱动：[run-fsapp.bat](run-fsapp.bat.md)（手工）/ [run-fsapp-auto.bat](run-fsapp-auto.bat.md)（自动取证）\n\n## 要验证的事\n\nnw.js 标准写法 `require(\u0027fs\u0027).appendFile(...)` 能否真的穿过桥改到应用目录下的\n`test-file.txt`，并 `readFileSync` 回读；另外专门验证**首屏主脚本栈**上同步 fs 立即可用。\n\n## 页面干了什么事\n\n1. **环境徽章**：探测 nw / require / process / fs 是否存在，打到顶部；\n2. **目标文件定位** `resolveTarget()`：依次取 `nw.__dirname` → `__nmbAppInfo.appPath`\n   → `process.cwd()`，拼出应用目录下的 `test-file.txt`；\n3. **主脚本栈同步 fs（页面加载即做，关键项）**：\n   `appendFileSync(file, \u0027main-stack @ \u003cISO\u003e\\n\u0027)` 后立刻 `readFileSync` 回读、数行数；\n   结果写 `window.__mainStackFs`（`ok:\u003c行数\u003e` / `FAIL:\u003c原因\u003e`）并显示。\n   这条验的是同步 RPC 通道在**首屏主脚本栈**上就能用，而不是要等定时器；\n4. **600ms 后自动跑一次** `doModify()`（也绑定按钮手工触发）：\n   `fs.appendFile(file, \u0027click @ \u003cISO\u003e\\n\u0027, cb)`（nw.js 标准异步写法，本兼容层里是同步实现的包装），\n   回调里 `verify()` → `readFileSync` 回读末行；3 秒回调没回来判超时；\n5. **结论外显，方便窗口外取证**：`setVerdict` 除了页面横幅，还把\n   `fsapp:PASS:\u003c通道\u003e` 或 `fsapp:FAIL:...|probe=\u003c探测错误\u003e|node=\u003cnode错误\u003e|main=\u003c主栈结果\u003e`\n   写进 `document.title`（auto runner 用 tasklist 读标题即可定位断点），并 console.log（宿主转 stderr）。\n\n## 硬证据\n\n磁盘上 `tests/apps/fsapp/test-file.txt`：每次成功追加一行时间戳。runner 删旧文件后启动，\n结束直接 type 该文件——有新内容即证明 fs 真正落了盘。\n"},{"p":"tests/app-smoke.md","g":"tests","t":"tests/apps/smoke —— 端到端冒烟应用（被测对象本身）","m":"# tests/apps/smoke —— 端到端冒烟应用（被测对象本身）\n\n- 页面：[tests/apps/smoke/index.html](../../tests/apps/smoke/index.html)；清单：[package.json](../../tests/apps/smoke/package.json)\n  （name `nw-bridge-smoke`，760x560 居中，title \"nw bridge smoke\"）\n- 驱动：[run-smoke.bat](run-smoke.bat.md)。**不需要构建：页面本身就是被测对象。**\n\n## 页面干了什么事\n\n`check(name, body)` 包 21 个断言，每个捕获异常转成 `{name, ok, detail}`；\n结果既渲染到页面 `\u003cpre\u003e`，也经 node 桥 `fs.writeFile` 落盘（落盘本身即 fs 用例），\n最后 `nw.App.quit()` 自退。\n\n### 第一阶段：同步断言（约 21 项，页面加载即跑）\n\n1. `window.nw` 已注入；2. `window.mbQuery` 是函数；3. `App.manifest.name` 正确；\n4. **App.dataPath 是盘绝对路径**（正则 `^[A-Za-z]:\\\\`——专盯 NormalizePath 曾把\n   `C:\\Users\\x` 折成 `C:Users\\x` 的盘相对路径 bug）；\n5. argv 里能找到 `--out=`；\n6. node 桥 `require(\u0027fs\u0027/\u0027path\u0027)`；7. Buffer hex 往返（`\u0027nw\u0027→\u00276e77\u0027`）；\n8. `process.platform===\u0027win32\u0027`；9. `path.join` win32 反斜杠；10. `os.EOL===CRLF`；\n11. **fs 落盘读回**：writeFileSync 写含中文的探针文件 → readFileSync 比对 → existsSync → unlinkSync；\n12. `Screen.screens`（属性不是方法，至少 1 块屏，bounds.width\u003e0）；\n13. `Window.get()` 有 title/setTitle（顺手 setTitle 验证）；\n14. **Clipboard 往返并还原原内容**（静态 get() 取单例、实例 get() 读文本的 nw 语义）；\n15. Menu/MenuItem/Tray/Shell/Shortcut 构造器齐备；\n16. DOM/canvas 2D 可用；17. file:// 下同步 XHR 能读本文件（验证 async=false 可用）；\n18. **同步通道 nmb-rpc 拦截即时作答**：读 `__nmbChannel`（syncBase 必须非空，打出\n   threads main/ui/sync 与 syncSharesUi）；\n19. **win.state 走同步通道**：当前窗口 id 非空、width/height\u003e0、x/y 读得到；\n20. **Window.open 先给句柄、id 异步结算**：立即返回的对象 setTitle 应进 pending（id 此刻为 null）；\n21. mbQuery 异步应答已发出（此阶段读 __asyncProbe 应仍为 0，等第二阶段）。\n\n### 第二阶段：1200ms 后异步观测（追加 `late[]`，重写报告后 quit）\n\nmbQuery 回调确实到达（`__asyncProbe=1`）、`Window.open` 的 id 已结算且 pending 清空、\n同步通道仍可用；任一不满足在 `late` 里写 `asyncCheck=FAIL: ...`。\n\n## 取证产物\n\n`smoke-result.json`：summary、channel（含实测线程拓扑与 rpcErrors/asyncErrors/nodeError）、\nresults、late。runner 用 findstr 扫 `\"ok\": false` 判定。\n"},{"p":"tests/app-title.md","g":"tests","t":"tests/apps/title —— 窗口标题（title_override）语义探针","m":"# tests/apps/title —— 窗口标题（title_override）语义探针\n\n- 页面：[index.html](../../tests/apps/title/index.html)、导航目标 [after.html](../../tests/apps/title/after.html)；\n  清单：[package.json](../../tests/apps/title/package.json)（name `nw-bridge-title-probe`，420x200，初始 title `MANIFEST-TITLE`）\n- 驱动：[run-title.bat](run-title.bat.md)（外部 tasklist 采样为权威证据）\n\n## 要验证的语义（nw.js title_override）\n\n1. 窗口建好后，HTML 的 `\u003ctitle\u003e` 决定标题栏；\n2. 页面显式 `win.setTitle(x)` = 设**覆盖值**，标题栏立即变 x；\n3. 覆盖值生效期间再改 `document.title`，**不得**改标题栏；\n4. 导航到新文档（loadURL/reload/back/forward 同理）后覆盖值清除，新页面 `\u003ctitle\u003e` 重新说了算。\n\n## 页面日程（全部标题用 ASCII，避开管道/控制台编码问题）\n\n- 0.5s：`0.html-title`，期望 `HTML-TITLE`（什么都不做，只核对）；\n- 3.0s：`1.setTitle`，调 `setTitle(\u0027OVERRIDE\u0027)`；\n- 6.0s：`2.document.title`，改 `document.title=\u0027JS-TITLE-2\u0027`，标题栏仍应是 `OVERRIDE`；\n- 9.0s：`3.navigate`，`location.href=\u0027after.html\u0027`；after.html 的 `\u003ctitle\u003e` 是 `AFTER-TITLE`，\n  它在 800ms 后 `syncNow()` 核对一次（第 4 步 `4.after-load`），3 秒后 `nw.App.quit()` 自退。\n\n## 记录方式（两路人马）\n\n- 每步动作后留 300ms 再 `win.syncNow()` 从 native **同步读权威值** `win.__title`\n  （那是宿主 SetWindowTextW 用的同一字段），与 want 比对；为避免与待处理异步命令竞速才留 300ms；\n- 每条结果 `{name, ok, actual, want}` 用 `fs.appendFile` 以 **JSONL** 追加到 `--out` 文件\n  （mb108 上 writeFileSync 可能抛，改走不依赖应答回程的异步 appendFile）；\n- 同时每步 console.log，宿主写 stderr；mb108 若同步读不可用，页面记录标 UNVERIFIED/THREW，\n  **最终语义判定交给 runner 对真实标题栏的时间线**（出现过 OVERRIDE 且末帧 AFTER-TITLE）。\n"},{"p":"tests/run-fsapp.bat.md","g":"tests","t":"run-fsapp.bat —— fs 改文件测试（手工版启动器）","m":"# run-fsapp.bat —— fs 改文件测试（手工版启动器）\n\n- 源文件：[tests/run-fsapp.bat](../../tests/run-fsapp.bat)\n- 被测应用：[tests/apps/fsapp](app-fsapp.md)\n\n## 干了什么事\n\n1. 检查 `bin\\nw.exe`（没有则退出码 1）；\n2. `start bin\\nw.exe --nwapp=tests\\apps\\fsapp --nw-no-dialog` 启动，**窗口保持打开**（手工测试）；\n3. 提示看两处结论：窗口里的 verdict 横幅，以及\"硬证据\" `tests\\apps\\fsapp\\test-file.txt`。\n\n## 测试动作\n\n页面加载时会自动跑一次主脚本栈同步 fs，并在 600ms 后自动点一次 appendFile；也可手工点页面按钮。\n每次 `require(\u0027fs\u0027).appendFile` 向 test-file.txt 追加一行时间戳，再 `readFileSync` 回读，\n回读到则页面判 PASS。是否真改了磁盘以 test-file.txt 内容为准。\n自动化（无窗口停留）版本见 [run-fsapp-auto.bat](run-fsapp-auto.bat.md)。\n"},{"p":"tests/run-fsapp-auto.bat.md","g":"tests","t":"run-fsapp-auto.bat —— fs 改文件测试（自动取证版）","m":"# run-fsapp-auto.bat —— fs 改文件测试（自动取证版）\n\n- 源文件：[tests/run-fsapp-auto.bat](../../tests/run-fsapp-auto.bat)\n- 被测应用：[tests/apps/fsapp](app-fsapp.md)\n\n## 干了什么事\n\n1. 先删掉旧的 `tests\\apps\\fsapp\\test-file.txt`（保证这次跑出来的文件是新证据）；\n2. `start bin\\nw.exe --nwapp=tests\\apps\\fsapp --nw-no-dialog`；\n3. `ping -n 9` 等约 8 秒：页面加载即做主脚本栈 `appendFileSync + readFileSync`，\n   600ms 后又自动做一次异步 `appendFile`，这段时间足够两次落盘；\n4. 打印三段取证：\n   - `---title---`：`tasklist /v /fo csv | find \"fsapp\"` 抓窗口标题——页面把结论\n     （`fsapp:PASS:\u003c通道\u003e` 或 `fsapp:FAIL:...|probe=...|node=...|main=...`）写进标题，\n     不用读 DOM 就能从外部定位断点；\n   - `---file---`：test-file.txt 存在就 `type` 出真实内容，不存在打印 `NO-FILE`；\n   - `---end---`；\n5. taskkill 收尾，退出码恒 0（结论靠打印内容人工/上层判断，不在此脚本里做布尔判定）。\n\n## 与手工版的区别\n\n[run-fsapp.bat](run-fsapp.bat.md) 留窗等人点按钮；本脚本无人值守，用\"删文件→跑→直接看磁盘文件\n+标题\"证明 fs 真的穿过桥改了文件系统。\n"},{"p":"tests/run-smoke.bat.md","g":"tests","t":"run-smoke.bat —— 21 项端到端冒烟的驱动脚本","m":"# run-smoke.bat —— 21 项端到端冒烟的驱动脚本\n\n- 源文件：[tests/run-smoke.bat](../../tests/run-smoke.bat)\n- 被测应用：[tests/apps/smoke](app-smoke.md)\n\n## 干了什么事\n\n1. 检查 `bin\\nw.exe`，没有则退出码 1；\n2. 删掉旧的 `tests\\.out\\smoke-result.json`，启动\n   `bin\\nw.exe --nwapp=tests\\apps\\smoke --out=\u003csmoke-result.json 全路径\u003e`（`start` 后台启动）；\n3. **轮询等报告**：每约 0.5~1 秒（`ping -n 2` 计时）看报告文件是否出现，最多 ~40 秒（80 次）；\n   超时 → taskkill 并退出码 **2**；\n4. **两阶段收割**：页面先写一版报告（同步断言，几乎立刻落盘），约 1.4 秒后再追加一版\n   （异步观测：mbQuery 应答、Window.open 的 id 结算）。所以看到文件后还多等 ~5 秒、\n   让应用自己 quit，再读文件——否则第二阶段丢失（脚本注释明确）；\n5. `findstr \"\\\"ok\\\": false\"`：报告里**只要有一条 false 就判 FAIL（退出码 3）**，不接受部分通过；\n   没有 false → 打印 PASS，退出码 **0**。\n\n## 取证产物\n\n- `tests\\.out\\smoke-result.json`：含 `passed/total/ok`、`channel`（syncBase、线程拓扑 main/ui/sync、\n  syncSharesUi、rpcErrors、asyncErrors、nodeError）与每条 `results`（name/ok/detail）和 `late` 数组。\n\n## 为什么这样设计\n\n页面在真实进程里把整条桥（nw.* + node 桥 + native fs/clipboard/screen RPC）都驱动一遍，\n并把结果用被测的 fs 通道自己落盘——\"落盘\"这一步本身也是 fs 往返用例。驱动脚本只负责\n\"起进程、等文件、判 false\"，不碰页面内部。\n"},{"p":"tests/run-title.bat.md","g":"tests","t":"run-title.bat —— 窗口标题链路回归（外部 tasklist 取证）","m":"# run-title.bat —— 窗口标题链路回归（外部 tasklist 取证）\n\n- 源文件：[tests/run-title.bat](../../tests/run-title.bat)\n- 被测应用：[tests/apps/title](app-title.md)\n\n## 为什么需要\"窗口外的证人\"\n\n页面**读不到自己的标题栏文字**（JS 没有这个 API）。所以证据分两路：\n- 页面每步 `console.log`，经宿主 `OnConsole` 写进 **stderr**（本脚本重定向到 `.out\\title-err.txt`）；\n- 脚本用 **`tasklist /v` 的 \"Window Title\" 字段从进程外部每秒采样真实标题栏**，\n  时间线同时打到屏幕和 `.out\\title-caption.txt`。\n\n## 干了什么事\n\n1. 清理 `.out\\` 下的 `title-err.txt / title-out.txt / title-caption.txt` 与 `title-result.json`；\n2. `start bin\\nw.exe --nwapp=tests\\apps\\title --out=\u003cresult\u003e`，stdout/stderr 分别重定向；\n3. 采样循环（最多 40 次 ≈ mb108 冷启动 ~9s + 页面日程 ~13s 留足余量；进程退出则提前结束）：\n   `tasklist /v /fi \"imagename eq nw.exe\" /fo list | findstr /b \"Window Title:\"`\n   取标题（/fo list 每行一个 \"标签: 值\"，for /f 按冒号切出值），打 `Ns \u003c标题\u003e` 并追加 caption 日志；\n4. 收割：taskkill，打印 stderr 页面日志与 `.out\\title-result.json`（JSONL 断言，页面侧 mb108 上\n   可能是 UNVERIFIED）；\n5. **以标题栏本身做权威判定**（页面 state 在 mb108 上读不到，不采信）：\n   - caption 里必须出现过 `OVERRIDE`（setTitle 覆盖值确实上了标题栏），否则退出码 **3**；\n   - 最后一帧非 `N/A` 标题必须是 `AFTER-TITLE`（导航清掉覆盖值、新文档 title 拿回标题栏），\n     否则退出码 **4**；\n   - 两者满足 → PASS，退出码 **0**；根本没报告 → 退出码 **2**。\n\n## 脚本里的 cmd 坑（注释有记录）\n\n- 裸 `|` 出现在 echo 文本里会被当管道；\n- for 块里嵌套 if 会被 cmd 解析器搞坏，所以判定放到顶层；\n- `findstr /v \"N/A\"` 排除采不到标题的帧，再取最后一帧。\n"},{"p":"tests/run-window.bat.md","g":"tests","t":"run-window.bat —— 窗口绑定回归（mb108 窗口类型 ABI）","m":"# run-window.bat —— 窗口绑定回归（mb108 窗口类型 ABI）\n\n- 源文件：[tests/run-window.bat](../../tests/run-window.bat)\n- 探针：[window_probe.ps1](window_probe.ps1.md)；复用 [title 应用](app-title.md)开窗（只需要它有个窗口）。\n\n## 验证什么\n\n修复 mb108 窗口类型 ABI 混用（旧代码把控件按 TRANSPARENT 窗口建，导致内核子窗口跑到屏幕 (0,0)）后，\n确认 miniblink 控件窗口：\n\n1. 作为框架窗口的**真实子窗口**存在；\n2. 不是画在屏幕原点 (0,0)；\n3. 落在框架窗口客户区内。\n\n即使页面的同步 fs 报告路径不可用，这套也能测——证据全部来自 Win32 API（GetWindow/GetParent/\nGetWindowRect）。\n\n## 干了什么事\n\n1. 先 `taskkill` 清掉残留 nw.exe（残留进程会干扰 Get-Process 找主窗口）；\n2. 启动 `bin\\nw.exe --nwapp=tests\\apps\\title --nw-no-dialog`；\n3. **等主窗口句柄**（最多 10 秒）：每秒用 PowerShell\n   `Get-Process nw | MainWindowHandle` 取非零句柄，写进 `%TEMP%\\nw_hwnd.txt` 再 `set /p` 读入。\n   注释说明为什么写临时文件而不是 for /f：PS 命令里的括号在 for /f 的 `in(\u0027...\u0027)` 解析里不安全。\n   10 秒仍无句柄 → `RC=2`；\n4. 多等 1 秒让内核把控件子窗口建完，调\n   `powershell -File window_probe.ps1 \u003chwnd\u003e`，取 `%errorlevel%`；\n5. taskkill 收尾，按 RC 打印 PASS / \"no main window after 10s\" / FAIL 并以 RC 退出\n   （0 通过、1 断言失败、2 无窗口）。\n"},{"p":"tests/window_probe.ps1.md","g":"tests","t":"window_probe.ps1 —— Win32 窗口绑定探针","m":"# window_probe.ps1 —— Win32 窗口绑定探针\n\n- 源文件：[tests/window_probe.ps1](../../tests/window_probe.ps1)\n- 被 [run-window.bat](run-window.bat.md) 以框架窗口句柄 `$h` 为参数调用。\n\n## 干了什么事\n\n1. `Add-Type` 内联 C# 声明三个 user32 P/Invoke：\n   `GetWindow(hwnd, uCmd)`、`GetParent(hwnd)`、`GetWindowRect(hwnd, out RECT)`；\n2. 参数无效（空或 0）→ 打印并退出码 **2**；\n3. `$child = GetWindow($main, 5)`（5 = **GW_CHILD**，取框架窗口的第一个子窗口，即内核控件窗口）；\n   `$parent = GetParent($child)`；分别取主窗口与子窗口的屏幕坐标矩形；\n4. 打印 main/child 句柄、child 的父、两者矩形，便于肉眼核对；\n5. 四条断言（`Check` 任一失败置 fail=1）：\n   - **child-exists**：GW_CHILD 取到非零句柄；\n   - **parent-is-host**：`GetParent(child) == 框架 hwnd`（不是孤儿顶层窗口）；\n   - **not-screen-origin**：子窗口左上角不是屏幕 (0,0)（旧 TRANSPARENT/CONTROL 混用的症状）；\n   - **child-inside-host**：子矩形四条边都在主矩形内（容差 ±2px，边框取整）；\n6. 全过退出码 **0**，任一失败退出码 **1**。输出全 ASCII（控制台码页安全）。\n"},{"p":"reference/00-extracted总览.md","g":"upstream reference","t":"reference/ —— 上游 nw.js 提取原件（只读对照，不参与编译）","m":"# reference/ —— 上游 nw.js 提取原件（只读对照，不参与编译）\n\n- 目录：[reference/](../../reference/)（整理前目录名是 `extracted\\`）\n- 性质：从 nw.js 上游源码中提取的**参考原件**，带原始版权头。本目录只用来\"对照语义、对齐 API 形状\"，\n  **不要修改、不参与 nw.exe 编译、运行时也不读取**。当前实现（[nw_host.cpp](../../src/nw_host.cpp)、\n  [js/api/](../../js/api/)）是对这些原件在 miniblink 上的重新实现，不是拷贝——原件依赖 Chromium base/IDL 编译链，\n  这里没有那套东西。\n\n分三组：`cc/`（C++ 原生侧）、`idl/`（接口定义）、`js/`（SDK 页面侧脚本）。\n\n---\n\n## 一、cc/ —— 原生侧 C++ 原件\n\n| 文件 | 内容 | 本项目对应的重新实现 |\n|---|---|---|\n| [nw_package.h](../../reference/cc/nw_package.h) / [nw_package.cc](../../reference/cc/nw_package.cc) | nw.js 的应用清单：package.json 解析、main 解析为启动 URL、应用目录定位、nodejs/single-instance 等字段 | [nw_package.h](../src/nw_package.h.md) / [nw_package.cpp](../src/nw_package.cpp.md)（base::Value → 自带 [nw_json.h](../src/nw_json.h.md)；去掉 zip .nw 解包） |\n| [shell_switches.h](../../reference/cc/shell_switches.h) / [shell_switches.cc](../../reference/cc/shell_switches.cc) | content shell 的命令行开关名（`--nwapp`、`--url`、`--remote-debugging-port` 等） | 散见于 [nw_main.cpp](../src/nw_main.cpp.md) 的参数解析与 [10_api_nw_app.js](../api/10_api_nw_app.js.md) 的过滤正则 |\n\n## 二、idl/ —— 接口定义（声明每个 nw 对象暴露哪些方法/事件/属性）\n\n这些 .idl 是判断\"某方法在 nw 里到底同步还是异步、属于静态还是实例、有没有对应事件\"的权威依据。\n当前实现没有 IDL 代码生成，人工对照其形状：\n\n- [nw_app.idl](../../reference/idl/nw_app.idl) → [10_api_nw_app.js](../api/10_api_nw_app.js.md)\n- [nw_window.idl](../../reference/idl/nw_window.idl) → [20_api_nw_window.js](../api/20_api_nw_window.js.md)\n- [nw_current_window_internal.idl](../../reference/idl/nw_current_window_internal.idl) → [15_api_nw_internal.js](../api/15_api_nw_internal.js.md)（binding 层）\n- [nw_menu.idl](../../reference/idl/nw_menu.idl) → [41_api_nw_menu.js](../api/41_api_nw_menu.js.md)\n- [nw_menuitem.idl](../../reference/idl/nw_menuitem.idl) → [40_api_nw_menuitem.js](../api/40_api_nw_menuitem.js.md)\n- [nw_clipboard.idl](../../reference/idl/nw_clipboard.idl) → [50_api_nw_clipboard.js](../api/50_api_nw_clipboard.js.md)\n- [nw_shell.idl](../../reference/idl/nw_shell.idl) → [51_api_nw_shell.js](../api/51_api_nw_shell.js.md)\n- [nw_screen.idl](../../reference/idl/nw_screen.idl) → [52_api_nw_screen.js](../api/52_api_nw_screen.js.md)\n- [nw_shortcut.idl](../../reference/idl/nw_shortcut.idl) → [53_api_nw_shortcut.js](../api/53_api_nw_shortcut.js.md)\n- [nw_tray.idl](../../reference/idl/nw_tray.idl) → [54_api_nw_tray.js](../api/54_api_nw_tray.js.md)\n- [nw_object.idl](../../reference/idl/nw_object.idl)、[nw_test.idl](../../reference/idl/nw_test.idl)：nw 基对象与测试接口（本项目只取其语义参考，无独立模块）。\n\n## 三、js/ —— SDK 页面侧脚本原件\n\n两套并存的历史形态都在：\n\n- **新名（模块化）**：`api_nw_app.js`、`api_nw_window.js`、`api_nw_newwin.js`、`api_window_internal.js`、\n  `api_nw_menu.js`、`api_nw_menuitem.js`、`api_nw_clipboard.js`、`api_nw_shell.js`、\n  `api_nw_screen.js`、`api_nw_shortcut.js`、`api_nw_tray.js`、`api_nw_object.js`、`api_nw_test.js`；\n- **旧名/ browser 侧**：`app.js`、`base.js`、`menu.js`、`menuitem.js`、`clipboard.js`、`shell.js`、\n  `screen.js`、`shorcut.js`（上游原拼写）、`tray.js`；\n- [nw_pre13_shim.js](../../reference/js/nw_pre13_shim.js)：nw 0.13 之前旧 API 的兼容垫片（本项目不实现旧 API）。\n\n与当前 [js/api/](../../js/api/) 模块的对应关系已在每篇 api 文档开头的\"对应 SDK\"一行注明；\n[00_base.js](../api/00_base.js.md) 对应这里的 `base.js` + bindingUtil 的角色，\n[90_install.js](../api/90_install.js.md) 对应 `api_nw_object.js`/装配部分。\n\n## 用法约定\n\n改当前实现的 API 形状前，先在这里查上游原件确认语义（尤其事件名、同步/异步、静态/实例），\n但**不要把原件里的 Chromium 专有调用**（`chrome.*`、bindingUtil 编译产物）照抄进来——\n本项目页面↔native 只有 [00_base.js](../api/00_base.js.md) 定义的 rpc/rpcAsync/tell 三个口子。\n"},{"p":"00-架构总览.md","g":"Start","t":"00 · 架构总览（模块索引 + 流程图）","m":"# 00 · 架构总览（模块索引 + 流程图）\n\n本文是整个项目的**模块索引**：先告诉你项目由哪几个模块（目录）组成、每个模块里有哪些文件、\n每个模块\"是干什么的、为什么存在、边界在哪\"；后半部分用流程图把运行期的几条主线（启动、通道、路由、线程）画出来。\n**想深入某个文件，点文件名链接进它的逐篇文档；想看真实代码，点文档顶部的\"源文件\"链接。**\n\n一句话项目背景：本项目是 **nw.js 的改版**——不携带 nw.js 那套庞大的 Chromium 内核，\n改为运行时动态加载 [mb108_x64.dll](../bin/mb108_x64.dll)（miniblink），由一个约 740 KB 的 Win32 小宿主\n`nw.exe` 把\"内核视图 + Win32 窗口 + 页面里的 nw.\\* API\"接起来，让已有 nw 应用不改或极少改即可运行。\n\n---\n\n## 模块一览（先看这棵树）\n\n```text\nnw\\\n├─ build-nw.bat          构建入口（不属于任何模块的一条总装命令）\n│\n├─ src\\                  ① native 宿主模块 —— 全部 C++，编译产物就是 nw.exe\n├─ generated\\            ② 内置脚本生成物 —— embed 工具产出，可删可重建\n├─ js\\                   ③ 页面注入脚本模块 —— 进窗口里跑的 JS（nw.* API + 纯 JS 版 node）\n│   ├─ nw_node.js\n│   └─ api\\              （12 个按数字前缀排序的模块）\n│\n├─ tools\\                ④ 构建/文档辅助工具模块\n├─ tests\\                ⑤ 回归测试模块（驱动脚本 + apps\\ 被测应用 + .out\\ 产物）\n├─ reference\\            ⑥ 上游 nw.js 只读参考（cc / idl / js，不编译不运行）\n├─ archive\\              ⑦ 退役历史件归档\n├─ mb-docs\\              ⑧ 本文档体系（这篇 + 43 篇逐文件文档 + index.html）\n└─ bin\\                  ⑨ 构建与运行产物（nw.exe + 内核 dll + JS 副本）\n```\n\n模块依赖方向（谁离不开谁）：\n\n```text\nbuild-nw.bat ──编译──► src\\ + generated\\ ──产出──► bin\\nw.exe\n     ▲                    ▲                              │\n     └─调用── tools\\      └─脚本来源── js\\               │ 运行时\n                                            运行时        ▼\n                                   bin\\nw.exe ◄──拷贝── js\\ 副本（优先读盘）\n                                      │\n                                      ├─ 加载内核 dll（bin\\mb108_x64.dll）\ntests\\ ──黑盒驱动──► bin\\nw.exe        └─ 加载 tests\\apps\\*\\package.json\nreference\\ / archive\\ 不参与编译与运行，只供人看\n```\n\n---\n\n## ① src\\ —— native 宿主模块（C++，项目的本体）\n\n**职责**：这是项目唯一编译成机器码的部分，产物 `bin\\nw.exe`。它对上（进程层）提供自己的\n`main()` 与 Win32 消息循环，对下（内核层）用 LoadLibrary + 函数指针表挂接 miniblink，\n对外（页面层）通过\"内核回调 + 注入 JS\"暴露 nw.js 兼容 API。原版 nw.js 里散落在 Chromium\ncontent 层、extensions AppWindow、IDL bindings、真 node 四五个子系统里的职责，\n在这个项目里全部收敛到这十几个 C++ 文件中。模块边界：**只写 native 侧逻辑，任何页面可见的\nJS API 形状都不在这里定义**（那是 ③ js 模块的事），两者通过 JSON 命令信封解耦。\n\n文件清单：\n\n| 文件 | 干什么 |\n|---|---|\n| [nw_main.cpp](../src/nw_main.cpp) | 进程入口 `main()`：DPI 感知、解析 `--nwapp/--nw-kernel/--nw-no-node/--nw-no-dialog`、串起 Start/OpenWindow/Run/Shutdown。 |\n| [nw_host.h](../src/nw_host.h) | 宿主声明层：`Host` 单例、`NwWindow` 结构（窗口全部镜像状态）、`HostOptions`、`Channel` 枚举。 |\n| [nw_host.cpp](../src/nw_host.cpp) | **最大最核心**（约 2300 行）：窗口生命周期、内核回调注册、脚本注入、命令分发 `Dispatch()`、10 组 `Api*` 实现、同步安全闸门（重入红线 + 白名单）。 |\n| [nw_kernel.h](../src/nw_kernel.h) | miniblink ABI：`KernelApi` 函数指针表（约 40 个 mb\\* 签名）与回调类型。 |\n| [nw_kernel.cpp](../src/nw_kernel.cpp) | 内核加载器：候选路径找 dll、`GetProcAddress` 取全部导出、必需导出缺失即失败、全局 `mbInit`。 |\n| [nw_rpc.h](../src/nw_rpc.h) / [nw_rpc.cpp](../src/nw_rpc.cpp) | 同步主通道：127.0.0.1 loopback HTTP 服务（随机端口、256bit 令牌、每连接 worker、403/404/413 等协议应答、有序关停）。 |\n| [nw_package.h](../src/nw_package.h) / [nw_package.cpp](../src/nw_package.cpp) | package.json 清单解析、应用目录自动定位、Win32 路径与宽窄字符编码工具。移植自 nw.js 同名文件，去掉 Chromium 依赖。 |\n| [nw_json.h](../src/nw_json.h) | header-only 极简 JSON（解析+序列化，容忍注释/BOM）。 |\n| [nw_script.h](../src/nw_script.h) | 内置注入脚本两个访问函数的声明。 |\n| [nw_script_stub.cpp](../src/nw_script_stub.cpp) | 内置脚本的空占位：embed 失败时改编译它（此时 exe 旁必须有 JS 文件）。 |\n\n## ② generated\\ —— 内置脚本生成物\n\n**职责**：解决\"单文件分发\"问题——把 ③ 里的全部 JS 烤进 exe，使 exe 旁边没有 JS 也能启动。\n这个模块里的东西**全部是构建产物，不是手写源码**：随时可以删除，下次构建由 tools\\embed-js.ps1\n自动重建。之所以单独成目录而不是混进 src\\，就是为了让人一眼分清\"哪些能改、哪些改了会被覆盖\"。\n\n| 文件 | 干什么 |\n|---|---|\n| [nw_script_generated.cpp](../generated/nw_script_generated.cpp) | JS 切片成每片 8000 字符的 C++ 原始字面量数组（避开 MSVC C2026 的 16380 字节静默截断），运行时拼回整串。**勿手改**。 |\n\n## ③ js\\ —— 页面注入脚本模块（窗口里运行的 JS）\n\n**职责**：这是\"在网页里重建 nw.js SDK\"的部分，随每个窗口的脚本上下文注入。它内部分两层：\n下层是 `api\\` 12 个模块拼成的 **nw.\\* API 层**（含通道地基），上层是 `nw_node.js` 的\n**纯 JS CommonJS 运行时**（不是真 node：没有 V8 集成、没有原生 .node/child_process/net，\n凡是要落操作系统的动作都经 `fs.`/`process.` 等 JSON 命令回到 native）。模块边界：\n**这里只做页面侧逻辑与 API 形状，不做任何特权操作**；文件读写、窗口控制等全部以命令形式下发。\n关键契约：宿主把 `api\\*.js` **按文件名排序拼成一个脚本**并统一包一层 IIFE，所以数字前缀即加载顺序，\n单个模块内禁止再套 IIFE、禁止重复 `\u0027use strict\u0027`。\n\n| 文件 | 干什么 |\n|---|---|\n| [nw_node.js](../js/nw_node.js) | 纯 JS CommonJS 运行时：require 解析（node_modules 上溯、package.json main、node: 前缀）、module 缓存、Buffer/process 与 fs/os/path/url/events 等内置模块；fs 全同步、经 RPC 落 native。 |\n| [00_base.js](../js/api/00_base.js) | **通道地基**：rpc/rpcAsync/tell/rpcSafe、三同步通道探测、载荷 base64+percent 编码、Emitter、exposeStatics。所有上层模块都建在它之上。 |\n| [10_api_nw_app.js](../js/api/10_api_nw_app.js) | nw.App：argv 过滤、manifest/dataPath、quit、全局热键 id 段、不可用能力的代理空实现。 |\n| [15_api_nw_internal.js](../js/api/15_api_nw_internal.js) | internalRead/Tell 分界层：上层模块只碰它、不直接碰通道；白名单镜像对账。 |\n| [20_api_nw_window.js](../js/api/20_api_nw_window.js) | nw.Window / WindowState：约 50 个窗口命令；title/zoom 访问器防回声；open 的 id 异步结算与命令排队；capturePage。 |\n| [40_api_nw_menuitem.js](../js/api/40_api_nw_menuitem.js) | MenuItem：菜单树递归序列化、分配点击回调 id。 |\n| [41_api_nw_menu.js](../js/api/41_api_nw_menu.js) | Menu：增删/插入/popup/attach；点击统一回 `__nmbMenuClick`。 |\n| [50_api_nw_clipboard.js](../js/api/50_api_nw_clipboard.js) | 剪贴板：text/html/png/rtf 读写与格式约定（png/rtf 走 base64）。 |\n| [51_api_nw_shell.js](../js/api/51_api_nw_shell.js) | openExternal / openItem / showItemInFolder / beep。 |\n| [52_api_nw_screen.js](../js/api/52_api_nw_screen.js) | 显示器枚举缓存、displayBoundsChanged（无可靠增删消息源，不发 added/removed）。 |\n| [53_api_nw_shortcut.js](../js/api/53_api_nw_shortcut.js) | 全局热键注册表、id 分配、`__nmbHotkey` 回调入口。 |\n| [54_api_nw_tray.js](../js/api/54_api_nw_tray.js) | 托盘图标：异步创建 + 图标排队、`__nmbTrayEvent`、右键弹菜单。 |\n| [90_install.js](../js/api/90_install.js) | **总装层**：缝出 window.nw、挂 `__nmb*` 事件入口、接管 window.open。 |\n\n## ④ tools\\ —— 构建/文档辅助工具模块\n\n**职责**：不进 exe、不进页面，只在开发机构建/维护时运行的脚本。\n\n| 文件 | 干什么 |\n|---|---|\n| [embed-js.ps1](../tools/embed-js.ps1) | 构建期把 js\\ 的全部 JS 切片生成 ② generated\\nw_script_generated.cpp；prologue/epilogue 必须与 nw_host.cpp 逐字节一致。ASCII only。 |\n| build-doc-index.ps1 | 把 mb-docs 全部 .md 打包成离线单页 [index.html](index.html)（目录树+全文搜索）；文档增删改后重跑。含中文，必须 UTF-8 带 BOM。 |\n\n## ⑤ tests\\ —— 回归测试模块\n\n**职责**：以**黑盒方式**驱动 bin\\nw.exe，验证\"内核接入、通道、API、窗口 ABI\"没有回归。\n分三部分：根目录是驱动脚本（.bat/.ps1），`apps\\` 是三个被启动的最小 nw 应用，\n`.out\\` 统一收运行产物（JSON 报告、日志、截图），不污染源码目录。先读 [测试总览](tests/00-测试总览.md)。\n\n| 文件 / 目录 | 干什么 |\n|---|---|\n| [run-smoke.bat](../tests/run-smoke.bat) | 端到端冒烟：21 项页面断言，报告落 .out；退出码 0 PASS / 2 超时 / 3 FAIL。 |\n| [run-title.bat](../tests/run-title.bat) | 用外部 `tasklist /v` 采真实标题栏，验证 setTitle 覆盖与导航清除；0/2/3/4。 |\n| [run-window.bat](../tests/run-window.bat) + [window_probe.ps1](../tests/window_probe.ps1) | Win32 P/Invoke 验 mb 控件窗是框架窗的真实子窗口且位置正确（窗口 ABI 回归）。 |\n| [run-fsapp.bat](../tests/run-fsapp.bat) / [run-fsapp-auto.bat](../tests/run-fsapp-auto.bat) | fs 落盘验证（手工 / 自动），硬证据是 apps\\fsapp\\test-file.txt。 |\n| apps\\smoke\\ | 21 项断言被测应用（nw.* 注入、node 桥、fs、Screen/Window/Clipboard、同步通道、open 结算…）。 |\n| apps\\title\\ | 标题链路被测应用（标题覆盖/导航语义），window 测试也复用它开窗。 |\n| apps\\fsapp\\ | fs 改文件被测应用。 |\n| .out\\ | 全部 result.json / 日志 / 截图的统一落点。 |\n\n## ⑥ reference\\ —— 上游 nw.js 只读参考\n\n**职责**：从 nw.js 上游提取的参考**原件**（带原始版权头），分 `cc/`（C++）、`idl/`（接口定义）、\n`js/`（SDK 页面脚本）三组。用途只有一个：重写 miniblink 版时**对照语义、对齐 API 形状**。\n硬边界：不改、不参与编译、运行时不读。详见 [reference 总览](reference/00-extracted总览.md)。\n\n## ⑦ archive\\ —— 退役历史件\n\n**职责**：当前构建与运行都不再使用、但有溯源价值而保留的文件，防止它们与现役文件混淆。\n内含 [nw_api.js](../archive/nw_api.js)（拆分前的单体页面脚本，已被 js\\api\\ 取代）、\nsplit_api.py（当年一次性拆分工具）、README.md（退役说明）。\n\n## ⑧ mb-docs\\ —— 文档模块\n\n[mb.md](mb.md) 总索引（功能速查 + 全量链接表）、43 篇逐文件文档、本文件，以及由\nbuild-doc-index.ps1 生成的 [index.html](index.html) 离线目录页。\n\n## ⑨ bin\\ —— 构建与运行产物\n\n`nw.exe`（小宿主）、`mb108_x64.dll`（约 60 MB 内核）、`nw.pdb`、`api\\*.js` 与 `nw_node.js`\n（exe **优先读旁边的副本**，于是\"改 JS 不必重编译\"；构建时从 js\\ 拷入）、cookies.dat 等运行时数据。\n\n---\n\n# 运行期流程图\n\n## 流程图 1 · 进程启动链（时间从上到下）\n\n```text\n[nw_main.cpp] main()\n   │  SetProcessDPIAware\n   │  CommandLineToArgvW 解析: --nwapp / --nw-kernel / --nw-no-node / --nw-no-dialog\n   ▼\n[nw_host.cpp] Host::Start()\n   │\n   ├─ PreparePaths            定 exe 目录 / 应用目录 / 用户数据目录\n   │\n   ├─ LoadKernel ───────────► [nw_kernel.cpp]\n   │                            LoadLibraryExW(mb108_x64.dll)\n   │                            GetProcAddress 取约 40 个 mb* 导出 -\u003e KernelApi 表\n   │                            mbInit()                       (必需导出缺失即启动失败)\n   │\n   ├─ LoadManifest ─────────► [nw_package.cpp] 读 apps\\xxx\\package.json -\u003e Manifest\n   │\n   ├─ LoadScripts            读 js\\api\\*.js + js\\nw_node.js\n   │                            └─读不到则用 generated 内置副本 (nw_script_generated.cpp)\n   │\n   └─ RpcServer::Start ─────► [nw_rpc.cpp] bind 127.0.0.1:随机端口 + 256bit 令牌\n                                (失败不致命: 页面后续退回 prompt 通道)\n   ▼\nHost::OpenWindow()\n   │  注册窗口类 -\u003e CreateWindowEx 建 Win32 框架窗\n   │  mbCreateWebView\n   │  mbSetHandle(view, hwnd)        ★内核控件窗嵌为框架窗的真实子窗口\n   │  注册内核回调: jsQuery / loadUrlBegin / promptBox /\n   │               scriptContext / documentReady / title / url / console / close / createView\n   │  mbLoadURL(manifest.main)\n   ▼\n内核回调 OnScriptContext / OnDocumentReady（幂等，两个时机各注入一次）\n   └─ InstallScripts(): preamble(__nwWindowId / __nmbRpcPort / __nmbRpcToken /\n                                  __nmbBootAppRepl
