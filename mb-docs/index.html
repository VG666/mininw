y / __nmbBootProcessReply …)\n                        + api\\*.js 拼接体 + nw_node.js\n   ▼\nHost::Run()  ◄════ GetMessage / TranslateMessage / DispatchMessage 循环 ════►\n   │            （HostWndProc 处理尺寸/菜单/热键/托盘/显示变化；直到 WM_QUIT）\n   ▼\nHost::Shutdown(): 停 RPC(join 线程) -\u003e 关内核视图 -\u003e 释放 dll\n```\n\n## 流程图 2 · 页面 ↔ native 的四条通道\n\nminiblink 没有\"同步绑定 JS 函数\"的导出，而 mbQuery 的应答在后续任务才投递、同步读拿不到，\n因此同步取数与异步动作分成四条路：\n\n```text\n                 页面 JS  (js\\api\\*.js)\n ┌───────────────────────────────────────────────────────────────┐\n │  同步取数 rpc() —— 启动时 probeSyncChannel() 探测, 探通谁用谁:  │\n └───────────────────────────────────────────────────────────────┘\n   │\n   ├─① loopback HTTP【主】  00_base.js loopbackOnce\n   │     同步 XHR POST  http://127.0.0.1:\u003c随机端口\u003e/w\u003c窗口id\u003e/?t=\u003c令牌\u003e\n   │                                  │\n   │                                  ▼\n   │                     [nw_rpc.cpp] accept 线程 -\u003e 每连接 worker 线程\n   │                                  │  令牌/来源校验 (错=\u003e403)\n   │                                  ▼\n   │                     Host::Dispatch(Channel::Sync)  ◄── 仅白名单命令可跑\n   │\n   ├─② prompt 拦截【退路】  promptOnce (最多 3 次重试)\n   │     window.prompt(\"__nmb_rpc__:\" + payload)\n   │                                  ▼\n   │                     [nw_host.cpp] OnPromptBox  (UI 线程, 唯一同线程的同步路)\n   │\n   ├─③ 伪URL 同步XHR【老内核退路】 xhrOnce\n   │     nmb-rpc: | /__nmb_rpc__/ | http://nmb-rpc/\n   │                                  ▼\n   │                     [nw_host.cpp] OnLoadUrlBegin (内核网络线程, 当场作答)\n   │                     (mb108 不回调此钩子; 留给 mb132 等老内核)\n   │\n   └─④ mbQuery【异步, 动手类操作】 rpcAsync() / tell()\n         mbQuery(id, json)\n                                    ▼\n                       [nw_host.cpp] OnJsQuery (UI 线程)\n                                    ▼\n                       Host::Dispatch(Channel::Async) -\u003e 全部 Api*\n\n   ◄════════════ 统一应答信封 { \"s\":\"ok\", \"v\":… } / { \"s\":\"err\", \"m\":… } ═══════════►\n              载荷编码三路统一: encodeURIComponent( btoa( UTF8字节 ) )\n```\n\n## 流程图 3 · 命令路由（Dispatch 按前缀分流）\n\n```text\n          JSON 请求 { \"c\": \"\u003c前缀\u003e.\u003c命令\u003e\", … }\n                        │\n                        ▼\n        ┌──────────────────────────────────┐\n        │ Host::Dispatch(json, channel)    │\n        │  先过两道安全闸门:                │\n        │  · BlinkReentrancyUnsafe()       │  eval/loadURL/reload/back/forward/\n        │                                  │  create/devtools 等重入红线 =\u003e 同步一律拒\n        │  · SyncSafeCommand()             │  白名单随处可跑; 其余 UI 命令\n        │                                  │  仅\"同步回调与 UI 同线程\"(仅②prompt)放行\n        └──────────────────────────────────┘\n                        │ 按 \"c\" 前缀\n   ┌──────────────┬─────┴──────────┬───────────────┬──────────────┐\n   ▼              ▼                ▼               ▼              ▼\n app.          win.            menu.           tray.        clipboard.\n ApiApp        ApiWindow        ApiMenu         ApiTray      ApiClipboard\n (约50命令,    +BuildMenuItems\n  最大一组)\n   │              │                │               │              │\n   ▼              ▼                ▼               ▼              ▼\n shell.       screen.         shortcut.        fs.           process.\n ApiShell     ApiScreen        ApiShortcut     ApiFs         ApiProcess\n                                (RegisterHotKey) (node桥文件后端)\n   └──────────────┴───── __title / __url: Dispatch 内联处理 ──────┴──────────────┘\n                    (内核标题/地址变化 -\u003e 改标题栏 + 推页面 __nmbEvent)\n\n 页面对应模块:  app→10_  win→20_  menu→40/41_  tray→54_\n                clipboard→50_  shell→51_  screen→52_  shortcut→53_\n                fs/process → nw_node.js\n```\n\n## 流程图 4 · 线程模型\n\n```text\n┌─────────────────────── UI 线程（主线程, 一个）────────────────────────┐\n│ Win32 GetMessage 循环 (Host::Run)                                     │\n│ 内核回调: OnJsQuery(异步通道④) OnPromptBox(同步退路②)                  │\n│           OnScriptContext OnDocumentReady OnTitleChanged …           │\n│ HostWndProc: 尺寸/菜单/热键/托盘/显示变化                              │\n│ Dispatch(Async) 与全部 Api* 的窗口/菜单/托盘操作都在这里执行            │\n└───────────────────────────────────────────────────────────────────────┘\n            ▲ 唯一被允许在同步路径里碰 UI 命令的通道 = ②prompt（同线程）\n            │\n┌─────────────────────── loopback 线程组（nw_rpc.cpp）──────────────────┐\n│ accept 线程: 非阻塞监听 + select 200ms 轮询 running_ 标志              │\n│    └─ accept 到连接 =\u003e 派一个一次性 worker 线程                        │\n│          worker: 读 HTTP 请求 -\u003e 校验令牌/来源 -\u003e Dispatch(Channel::Sync)\n│          （非 UI 线程, 因此永远只能跑到 SyncSafeCommand 白名单）        │\n└───────────────────────────────────────────────────────────────────────┘\n┌─────────────────────── 内核网络线程（miniblink 内部）──────────────────┐\n│ OnLoadUrlBegin: 同步退路③ 的伪 URL 在此当场作答                        │\n└───────────────────────────────────────────────────────────────────────┘\n\n 三个线程号运行时记入原子量 g_threadMain / g_threadUi / g_threadSync，\n transport 类型记入 g_syncTransport，并随 app.info.threads 报给页面自检。\n```\n\n## 流程图 5 · 一次窗口操作的往返（以 win.setTitle 为例）\n\n```text\n 页面 (20_api_nw_window.js)                native (nw_host.cpp)\n        │                                       │\n        │  title 访问器写 __title 镜像(防回声)    │\n        │  rpcAsync(\"win.setTitle\", {title})     │\n        │ ─────────── mbQuery ────────────────►  │\n        │                                       OnJsQuery (UI 线程)\n        │                                          Dispatch -\u003e ApiWindow\n        │                                          SetWindowText + NwWindow.titleOverride\n        │  ◄──────── mbResponseQuery ───────────  返回 {s:ok}\n        │                                       │\n        │  (若 document.title 之后变化)           │\n        │  ◄──── EvalInWindow __nmbEvent ─────── 内核 OnTitleChanged\n        │  访问器比对镜像, 不被回声覆盖           │\n```\n"}];

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function norm(p, base){
  if(!p) return p;
  if(/^[a-z]+:/i.test(p) || p.charAt(0)==='#') return p;
  var baseDir = base.indexOf('/')>=0 ? base.split('/').slice(0,-1).join('/') : '';
  var stack = baseDir ? baseDir.split('/') : [];
  p.split('/').forEach(function(part){
    if(part===''||part==='.') return;
    if(part==='..') stack.pop(); else stack.push(part);
  });
  return stack.join('/');
}
function inline(s, base){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, function(_,c){ return '<code>'+c+'</code>'; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function(_,alt,url){
    return '<img alt="'+alt+'" src="'+esc(url)+'">';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function(_,text,url){
    var internal = !/^[a-z]+:/i.test(url) && url.charAt(0)!=='#' && url.indexOf('.md')>=0;
    var np = norm(url, base);
    if(internal){
      var hash = '';
      var h = url.indexOf('#');
      if(h>=0){ hash = url.slice(h+1); np = norm(url.slice(0,h), base); }
      return '<a href="#" data-doc="'+esc(np)+(hash?('#'+esc(hash)):'')+'">'+text+'</a>';
    }
    return '<a href="'+esc(np)+'" target="_blank" rel="noopener">'+text+'</a>';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return s;
}
function renderMd(md, base){
  var lines = md.replace(/\r\n/g,'\n').split('\n');
  var html = [];
  var i = 0;
  while(i < lines.length){
    var line = lines[i];
    if(/^```/.test(line.trim())){
      var buf = [];
      i++;
      while(i < lines.length && !/^```/.test(lines[i].trim())){ buf.push(lines[i]); i++; }
      i++;
      html.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    if(/^\|.+\|\s*$/.test(line)){
      var tbl=[];
      while(i < lines.length && /^\|.+\|\s*$/.test(lines[i])){ tbl.push(lines[i]); i++; }
      function cells(row){
        return row.replace(/^\||\|\s*$/g,'').split('|').map(function(c){return c.trim();});
      }
      var head = cells(tbl[0]);
      var h = '<tr>'+head.map(function(c){return '<th>'+inline(c,base)+'</th>';}).join('')+'</tr>';
      var bodyRows = tbl.slice(1).filter(function(r){ return !/^\|[\s:|-]+\|\s*$/.test(r); });
      var b = bodyRows.map(function(r){
        return '<tr>'+cells(r).map(function(c){return '<td>'+inline(c,base)+'</td>';}).join('')+'</tr>';
      }).join('');
      html.push('<table><thead>'+h+'</thead><tbody>'+b+'</tbody></table>');
      continue;
    }
    var hm = line.match(/^(#{1,6})\s+(.*)$/);
    if(hm){ html.push('<h'+hm[1].length+'>'+inline(hm[2],base)+'</h'+hm[1].length+'>'); i++; continue; }
    if(/^\s*$/.test(line)){ i++; continue; }
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){ html.push('<hr>'); i++; continue; }
    if(/^&gt;\s?/.test(line) || /^>\s?/.test(line)){
      var q=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
      html.push('<blockquote>'+inline(q.join(' '),base)+'</blockquote>');
      continue;
    }
    var lm = line.match(/^(\s*)([-*+])\s+(.*)$/);
    if(lm){
      var ul=[];
      while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ ul.push(lines[i].replace(/^\s*[-*+]\s+/,'')); i++; }
      html.push('<ul>'+ul.map(function(x){return '<li>'+inline(x,base)+'</li>';}).join('')+'</ul>');
      continue;
    }
    var om = line.match(/^(\s*)\d+\.\s+(.*)$/);
    if(om){
      var ol=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ ol.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++; }
      html.push('<ol>'+ol.map(function(x){return '<li>'+inline(x,base)+'</li>';}).join('')+'</ol>');
      continue;
    }
    if(/^<(div|br|hr|img|a)\b/i.test(line)){ html.push(line); i++; continue; }
    var para=[];
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\||>|\s*[-*+]\s|\s*\d+\.\s|<)/.test(lines[i])
          && !/^\s*([-*_])\1{2,}\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    html.push('<p>'+inline(para.join(' '),base)+'</p>');
  }
  return html.join('\n');
}

var byPath = {};
DOCS.forEach(function(d){ byPath[d.p] = d; });

var nav = document.getElementById('nav');
var groups = {};
DOCS.forEach(function(d){
  if(!groups[d.g]) groups[d.g] = [];
  groups[d.g].push(d);
});
Object.keys(groups).forEach(function(g){
  var h = document.createElement('div');
  h.className = 'grouph';
  h.textContent = g + ' (' + groups[g].length + ')';
  nav.appendChild(h);
  groups[g].forEach(function(d){
    var a = document.createElement('a');
    a.className = 'item';
    a.href = '#';
    a.setAttribute('data-nav', d.p);
    a.innerHTML = esc(d.t) + '<span class="path">'+esc(d.p)+'</span>';
    a.addEventListener('click', function(e){ e.preventDefault(); openDoc(d.p); });
    nav.appendChild(a);
  });
});

var content = document.getElementById('content');
var crumb = document.getElementById('crumb');
function openDoc(path, hash){
  var d = byPath[path];
  if(!d){ return; }
  document.title = d.t + ' — mb 技术文档';
  content.innerHTML = renderMd(d.m, d.p);
  crumb.innerHTML = '<span class="pill">'+esc(d.g)+'</span> ' + esc(d.p);
  var nodes = nav.querySelectorAll('[data-nav]');
  for(var k=0;k<nodes.length;k++) nodes[k].classList.toggle('active', nodes[k].getAttribute('data-nav')===path);
  document.getElementById('main').scrollTop = 0;
  if(hash){
    var target = document.getElementById(hash) ||
      content.querySelector('[id="'+hash+'"], a[name="'+hash+'"]');
    if(target) target.scrollIntoView();
  }
  if(window.innerWidth <= 820) document.getElementById('side').classList.remove('open');
}

document.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('a[data-doc]') : null;
  if(a){
    e.preventDefault();
    var v = a.getAttribute('data-doc');
    var hpos = v.indexOf('#');
    if(hpos>=0) openDoc(v.slice(0,hpos), v.slice(hpos+1)); else openDoc(v);
  }
});

document.getElementById('q').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  var items = nav.querySelectorAll('.item');
  var heads = nav.querySelectorAll('.grouph');
  items.forEach(function(it){
    var d = byPath[it.getAttribute('data-nav')];
    var hit = !q || d.t.toLowerCase().indexOf(q)>=0 || d.m.toLowerCase().indexOf(q)>=0;
    it.classList.toggle('hidden', !hit);
  });
  heads.forEach(function(h){
    var next = h.nextElementSibling, any = false;
    while(next && next.classList.contains('item')){
      if(!next.classList.contains('hidden')){ any = true; break; }
      next = next.nextElementSibling;
    }
    h.style.display = any ? '' : 'none';
  });
});

document.getElementById('menuBtn').addEventListener('click', function(){
  document.getElementById('side').classList.toggle('open');
});

var start = DOCS.some(function(d){return d.p==='mb.md';}) ? 'mb.md' : DOCS[0].p;
openDoc(start);
</script>
</body>
